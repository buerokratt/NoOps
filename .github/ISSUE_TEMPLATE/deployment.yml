---
name: Manual Deployment
description: "Track a manually executed deployment"
labels: 
  - deployment

body:
  - type: input
    id: client
    attributes:
      label: "Client"
      description: "Who is receiving the deployment?"

  - type: input
    id: version
    attributes:
      label: "Version deployed"
      description: "Example: v3.0.0"

  - type: input
    id: date
    attributes:
      label: "Delivery Date"
      description: "dd-mm-yyyy"

  - type: dropdown
    id: engineer
    attributes:
      label: "Engineer"
      options:
        - Georg
        - Fredy
        - Varmo

  - type: textarea
    id: contents
    attributes:
      label: "What was deployed?"
      description: "Entire version or components/modules, configmaps etc"

  - type: textarea
    id: notes
    attributes:
      label: "Notes / Problems"
---
