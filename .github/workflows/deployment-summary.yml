name: Update Deployment Summary

on:
  issues:
    types: [labeled]

jobs:
  update-summary:
    runs-on: ubuntu-latest
    if: contains(github.event.label.name, 'deployed') # only run when 'deployed' label added
    steps:
      - uses: actions/checkout@v3

      - name: Extract issue details from form JSON
        run: |
          ISSUE_BODY="${{ github.event.issue.body }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          ISSUE_URL="${{ github.event.issue.html_url }}"

          # Parse JSON from GitHub Issue Form using jq
          CLIENT=$(echo "$ISSUE_BODY" | jq -r '.client // ""')
          VERSION=$(echo "$ISSUE_BODY" | jq -r '.version // ""')
          DATE=$(echo "$ISSUE_BODY" | jq -r '.date // ""')
          ENGINEER=$(echo "$ISSUE_BODY" | jq -r '.engineer // ""')
          CONTENTS=$(echo "$ISSUE_BODY" | jq -r '.contents // ""')
          NOTES=$(echo "$ISSUE_BODY" | jq -r '.notes // ""')

          # Replace newlines in Notes and Contents with <br> for Markdown table
          NOTES=$(echo "$NOTES" | sed ':a;N;$!ba;s/\n/<br>/g')
          CONTENTS=$(echo "$CONTENTS" | sed ':a;N;$!ba;s/\n/<br>/g')

          echo "CLIENT=$CLIENT" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "ENGINEER=$ENGINEER" >> $GITHUB_ENV
          echo "CONTENTS=$CONTENTS" >> $GITHUB_ENV
          echo "NOTES=$NOTES" >> $GITHUB_ENV
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_ENV
          echo "ISSUE_URL=$ISSUE_URL" >> $GITHUB_ENV

      - name: Update deployment summary
        run: |
          SUMMARY_FILE="DEPLOYMENTS.md"

          if [ ! -f $SUMMARY_FILE ]; then
            echo "| Client | Version | Date | Engineer | Contents | Notes | Issue |" > $SUMMARY_FILE
            echo "|--------|---------|------|---------|---------|-------|-------|" >> $SUMMARY_FILE
          fi

          if grep -q "Issue #$ISSUE_NUMBER" $SUMMARY_FILE; then
            echo "Issue #$ISSUE_NUMBER already in summary. Skipping."
          else
            echo "| $CLIENT | $VERSION | $DATE | $ENGINEER | $CONTENTS | $NOTES | [Issue #$ISSUE_NUMBER]($ISSUE_URL) |" >> $SUMMARY_FILE
          fi

      - name: Commit summary
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update deployment summary for $CLIENT - $VERSION"
          branch: dev
