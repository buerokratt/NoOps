name: Update Deployment Summary

on:
  issues:
    types: [labeled]

jobs:
  update-summary:
    runs-on: ubuntu-latest
    if: contains(github.event.label.name, 'deployed') # only run when 'deployed' label added
    steps:
      - uses: actions/checkout@v3

      - name: Extract issue details
        run: |
          ISSUE_BODY="${{ github.event.issue.body }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          ISSUE_URL="${{ github.event.issue.html_url }}"

          # Extract fields robustly, ignoring case and trimming spaces
          CLIENT=$(echo "$ISSUE_BODY" | grep -i "^Client:" | head -n1 | cut -d':' -f2- | xargs)
          VERSION=$(echo "$ISSUE_BODY" | grep -i "^Version deployed:" | head -n1 | cut -d':' -f2- | xargs)
          DATE=$(echo "$ISSUE_BODY" | grep -i "^Delivery Date:" | head -n1 | cut -d':' -f2- | xargs)
          ENGINEER=$(echo "$ISSUE_BODY" | grep -i "^Engineer:" | head -n1 | cut -d':' -f2- | xargs)

          # Extract multi-line notes and convert newlines to <br> for Markdown table
          NOTES=$(echo "$ISSUE_BODY" | awk '/Notes \/ Problems:/ {flag=1; next} /^$/ {flag=0} flag {print}' | sed ':a;N;$!ba;s/\n/<br>/g' | xargs)

          # Export as GitHub environment variables
          echo "CLIENT=$CLIENT" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "ENGINEER=$ENGINEER" >> $GITHUB_ENV
          echo "NOTES=$NOTES" >> $GITHUB_ENV
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_ENV
          echo "ISSUE_URL=$ISSUE_URL" >> $GITHUB_ENV

      - name: Update deployment summary
        run: |
          SUMMARY_FILE="DEPLOYMENTS.md"

          if [ ! -f $SUMMARY_FILE ]; then
            echo "| Client | Version | Date | Engineer | Notes | Issue |" > $SUMMARY_FILE
            echo "|--------|---------|------|---------|-------|-------|" >> $SUMMARY_FILE
          fi

          # Check if this issue number already exists in the file
          if grep -q "Issue #$ISSUE_NUMBER" $SUMMARY_FILE; then
            echo "Issue #$ISSUE_NUMBER already in summary. Skipping."
          else
            echo "| $CLIENT | $VERSION | $DATE | $ENGINEER | $NOTES | [Issue #$ISSUE_NUMBER]($ISSUE_URL) |" >> $SUMMARY_FILE
          fi

      - name: Commit summary
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update deployment summary for $CLIENT - $VERSION"
          branch: dev
