name: Update Deployment Summary

on:
  issues:
    types: [labeled]

jobs:
  update-summary:
    runs-on: ubuntu-latest
    if: contains(github.event.label.name, 'deployed') # only run when 'deployed' label added
    steps:
      - uses: actions/checkout@v3

      - name: Extract issue details from Markdown form
        run: |
          ISSUE_BODY="${{ github.event.issue.body }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          ISSUE_URL="${{ github.event.issue.html_url }}"

          # Function to extract section content until next ### or EOF
          extract_section() {
            local section="$1"
            awk -v sec="$section" '
              BEGIN {flag=0}
              $0 ~ "### " sec {flag=1; next}
              $0 ~ /^### / && flag {flag=0}
              flag {print}
            ' <<< "$ISSUE_BODY" | sed '/^\s*$/d'
          }

          CLIENT=$(extract_section "Client" | xargs)
          VERSION=$(extract_section "Version deployed" | xargs)
          DATE=$(extract_section "Delivery Date" | xargs)
          ENGINEER=$(extract_section "Engineer" | xargs)
          CONTENTS=$(extract_section "What was deployed?" | sed ':a;N;$!ba;s/\n/<br>/g' | xargs)
          NOTES=$(extract_section "Notes / Problems" | sed ':a;N;$!ba;s/\n/<br>/g' | xargs)

          # Ensure empty fields do not break table
          CLIENT=${CLIENT:-"—"}
          VERSION=${VERSION:-"—"}
          DATE=${DATE:-"—"}
          ENGINEER=${ENGINEER:-"—"}
          CONTENTS=${CONTENTS:-"—"}
          NOTES=${NOTES:-"—"}
          ISSUE_LINK="[Issue #$ISSUE_NUMBER]($ISSUE_URL)"

          # Export for later steps
          echo "CLIENT=$CLIENT" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "ENGINEER=$ENGINEER" >> $GITHUB_ENV
          echo "CONTENTS=$CONTENTS" >> $GITHUB_ENV
          echo "NOTES=$NOTES" >> $GITHUB_ENV
          echo "ISSUE_LINK=$ISSUE_LINK" >> $GITHUB_ENV

      - name: Update deployment summary
        run: |
          SUMMARY_FILE="DEPLOYMENTS.md"

          if [ ! -f $SUMMARY_FILE ]; then
            echo "| Client | Version | Date | Engineer | Contents | Notes | Issue |" > $SUMMARY_FILE
            echo "|--------|---------|------|---------|---------|-------|-------|" >> $SUMMARY_FILE
          fi

          if grep -q "Issue #${{ github.event.issue.number }}" $SUMMARY_FILE; then
            echo "Issue #${{ github.event.issue.number }} already in summary. Skipping."
          else
            echo "| $CLIENT | $VERSION | $DATE | $ENGINEER | $CONTENTS | $NOTES | $ISSUE_LINK |" >> $SUMMARY_FILE
          fi

      - name: Commit summary
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update deployment summary for $CLIENT - $VERSION"
          branch: dev
