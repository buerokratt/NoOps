name: Update Deployment Summary

on:
  issues:
    types: [opened]

jobs:
  update-summary:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Check for deployment label
      - name: Check if issue has 'deployment' label
        if: "!contains(github.event.issue.labels.*.name, 'deployed')"
        run: |
          echo "Issue does not have the 'deployment' label. Exiting."
          exit 0

      # Step 3: Extract fields and update summary
      - name: Update summary
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = '.github/ISSUE_SUMMARY.md';
            const issue_number = context.issue.number;
            const body = context.payload.issue.body;

            const getField = (label) => {
              const match = body.match(new RegExp(`\\*\\*${label}:\\*\\*\\s*(.*)`,'i'));
              return match ? match[1].trim() : '';
            };

            const client = getField('Client');
            const version = getField('Version deployed');
            const date = getField('Delivery Date');
            const engineer = getField('Engineer');
            const notes = getField('Notes / Problems');

            const newRow = `| ${client} | ${version} | ${date} | ${engineer} | ${notes} | [Issue #${issue_number}](${context.payload.issue.html_url}) |`;

            let summary = '';
            if (fs.existsSync(path)) {
              summary = fs.readFileSync(path, 'utf8');
              summary += '\n' + newRow;
            } else {
              summary = '| Client | Version | Date | Engineer | Notes | Issue |\n|--------|---------|------|---------|-------|-------|\n' + newRow;
            }

            fs.writeFileSync(path, summary);

      # Step 4: Commit the updated summary
      - name: Commit summary update
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update deployment summary for issue #${{ github.event.issue.number }}"
          branch: dev
