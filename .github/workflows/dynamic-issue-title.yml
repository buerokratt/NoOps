name: Dynamic Issue Title

on:
  issues:
    types: [opened]

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;

            // For GitHub Issue Forms, the submitted fields are in payload.issue.fields
            const fields = context.payload.issue.fields || {};
            const client = fields.client || "UnknownClient";
            const version = fields.version || "v0.0.0";
            const date = fields.date || new Date().toISOString().slice(0,10);

            const newTitle = `[Deployment] ${client} - ${version} - ${date}`;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              title: newTitle
            });
