name: Dynamic Issue Title

on:
  issues:
    types: [opened]

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const body = context.payload.issue.body;

            // Regex helpers to extract Client and Version from issue body
            const clientMatch = body.match(/Client\s*:\s*(.*)/i);
            const versionMatch = body.match(/Version deployed\s*:\s*(.*)/i);

            const client = clientMatch ? clientMatch[1].trim() : "UnknownClient";
            const version = versionMatch ? versionMatch[1].trim() : "v0.0.0";

            // Current date YYYY-MM-DD
            const date = new Date().toISOString().slice(0,10);

            const newTitle = `[Deployment] ${client} - ${version} - ${date}`;

            // Use the GitHub client provided by actions/github-script
            await github.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              title: newTitle
            });
