name: Dynamic Issue Title

on:
  issues:
    types: [opened]

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const body = context.payload.issue.body;

            // Täpsed regexid Markdownist
            const clientMatch = body.match(/\*\*Client:\*\*\s*(.+)/);
            const versionMatch = body.match(/\*\*Version deployed:\*\*\s*(.+)/);
            const dateMatch = body.match(/\*\*Delivery Date:\*\*\s*(.+)/);

            const client = clientMatch ? clientMatch[1].trim() : "UnknownClient";
            const version = versionMatch ? versionMatch[1].trim() : "v0.0.0";
            const date = dateMatch ? dateMatch[1].trim() : new Date().toISOString().slice(0,10);

            const newTitle = `[Deployment] ${client} - ${version} - ${date}`;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              title: newTitle
            });
