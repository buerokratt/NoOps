name: Dynamic Issue Title

on:
  issue_form:
    types: [submitted]

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;

            // Access the form inputs directly
            const client = context.payload.inputs.client || "UnknownClient";
            const version = context.payload.inputs.version || "v0.0.0";
            const date = context.payload.inputs.date || new Date().toISOString().slice(0,10);

            const newTitle = `[Deployment] ${client} - ${version} - ${date}`;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              title: newTitle
            });
