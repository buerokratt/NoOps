name: Publish component Helm charts

on:
  workflow_dispatch:
  push:
    branches:
      - temp-mig
    paths:
      - .github/helm-charts.json
      - .github/workflows/publish-helm-charts.yml
      - Kubernetes/Components/**

concurrency:
  group: publish-component-charts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-dependencies:
    name: Build Helm dependencies
    runs-on: ubuntu-22.04

    permissions:
      contents: write
      packages: read

    env:
      HELM_VERSION: v3.18.4
      OCI_REGISTRY: ghcr.io

    outputs:
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "${GHCR_TOKEN}" | helm registry login "${OCI_REGISTRY}" \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Update and build Helm dependencies
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t chart_dirs < <(
            jq -r '
              .charts[]
              | select(.enabled == true)
              | .path
            ' .github/helm-charts.json
          )

          if [[ "${#chart_dirs[@]}" -eq 0 ]]; then
            echo "No enabled Helm charts found."
            exit 0
          fi

          echo "Found ${#chart_dirs[@]} enabled Helm chart(s)."

          for chart_dir in "${chart_dirs[@]}"; do
            echo "::group::Build dependencies: ${chart_dir}"

            if [[ ! -d "${chart_dir}" ]]; then
              echo "::error::Chart directory does not exist: ${chart_dir}"
              exit 1
            fi

            if [[ ! -f "${chart_dir}/Chart.yaml" ]]; then
              echo "::error::Chart.yaml does not exist: ${chart_dir}/Chart.yaml"
              exit 1
            fi

            echo "Updating Helm dependencies for ${chart_dir}..."
            helm dependency update "${chart_dir}"

            echo "Building Helm dependencies for ${chart_dir}..."
            helm dependency build "${chart_dir}"

            # If dependencies are declared, make sure Helm produced Chart.lock.
            if grep -Eq '^[[:space:]]*dependencies:' "${chart_dir}/Chart.yaml"; then
              if [[ ! -f "${chart_dir}/Chart.lock" ]]; then
                echo "::error::${chart_dir}/Chart.yaml declares dependencies but Chart.lock was not generated."
                exit 1
              fi

              echo "Chart.lock generated:"
              ls -la "${chart_dir}/Chart.lock"
            fi

            if [[ -d "${chart_dir}/charts" ]]; then
              echo "Downloaded dependencies:"
              ls -la "${chart_dir}/charts"
            fi

            echo "::endgroup::"
          done

      - name: Commit dependency changes
        id: source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -t chart_dirs < <(
            jq -r '
              .charts[]
              | select(.enabled == true)
              | .path
            ' .github/helm-charts.json
          )

          # Stage changes from all enabled chart directories.
          #
          # Using "git add -A" also handles:
          #   - newly generated Chart.lock files
          #   - updated Chart.lock files
          #   - downloaded charts/*.tgz
          #   - removed old dependencies
          for chart_dir in "${chart_dirs[@]}"; do
            git add -A -- "${chart_dir}"
          done

          echo "Dependency changes:"
          git status --short

          if ! git diff --cached --quiet; then
            git commit -m "chore: update Helm dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No Helm dependency changes."
          fi

          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  prepare:
    name: Select enabled charts
    needs:
      - build-dependencies

    runs-on: ubuntu-22.04

    permissions:
      contents: read

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      source_sha: ${{ needs.build-dependencies.outputs.source_sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-dependencies.outputs.source_sha }}

      - name: Build chart matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          matrix="$(
            jq -c '
              {
                chart: [
                  .charts[]
                  | select(.enabled == true)
                ]
              }
            ' .github/helm-charts.json
          )"

          count="$(jq '.chart | length' <<< "${matrix}")"

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

          echo "Enabled chart matrix: ${matrix}"

  publish:
    name: Publish ${{ matrix.chart.name }}

    needs:
      - prepare

    if: needs.prepare.outputs.count != '0'

    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    env:
      HELM_VERSION: v3.18.4

      OCI_REGISTRY: ghcr.io
      OCI_REPOSITORY: oci://ghcr.io/buerokratt/helm

      CHART_NAME: ${{ matrix.chart.name }}
      CHART_DIR: ${{ matrix.chart.path }}
      SET_VALUES_JSON: ${{ toJSON(matrix.chart.setValues) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Read and validate chart metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${CHART_DIR}/Chart.yaml" ]]; then
            echo "::error::Missing Chart.yaml: ${CHART_DIR}/Chart.yaml"
            exit 1
          fi

          actual_name="$(
            helm show chart "${CHART_DIR}" |
              awk '/^name:[[:space:]]/ { print tolower($2); exit }'
          )"

          chart_version="$(
            helm show chart "${CHART_DIR}" |
              awk '/^version:[[:space:]]/ { print $2; exit }'
          )"

          if [[ "${actual_name}" != "${CHART_NAME}" ]]; then
            echo "::error::Chart name mismatch. JSON=${CHART_NAME}, Chart.yaml=${actual_name}"
            exit 1
          fi

          if [[ -z "${chart_version}" ]]; then
            echo "::error::Chart version is empty for ${CHART_DIR}"
            exit 1
          fi

          echo "version=${chart_version}" >> "${GITHUB_OUTPUT}"
          echo "Publishing candidate ${CHART_NAME}:${chart_version} from ${CHART_DIR}"

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "${GHCR_TOKEN}" | helm registry login "${OCI_REGISTRY}" \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Build dependencies, lint, and package
        id: package
        shell: bash
        env:
          CHART_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail

          # If this chart declares dependencies, Chart.lock must already
          # have been generated by the build-dependencies job.
          if grep -Eq '^[[:space:]]*dependencies:' "${CHART_DIR}/Chart.yaml"; then
            if [[ ! -f "${CHART_DIR}/Chart.lock" ]]; then
              echo "::error::${CHART_DIR}/Chart.yaml declares dependencies but Chart.lock is missing."
              exit 1
            fi
          fi

          # Rebuild charts/ using the committed Chart.lock.
          helm dependency build "${CHART_DIR}"

          mapfile -t set_values < <(
            jq -r '.[]' <<< "${SET_VALUES_JSON}"
          )

          helm_args=()

          for value in "${set_values[@]}"; do
            helm_args+=(--set-string "${value}")
          done

          helm lint "${CHART_DIR}" \
            --strict \
            "${helm_args[@]}"

          mkdir -p dist

          package_output="$(
            helm package "${CHART_DIR}" \
              --destination dist
          )"

          chart_package="${package_output##*: }"

          if [[ ! -f "${chart_package}" ]]; then
            echo "::error::Helm package was not generated: ${chart_package}"
            exit 1
          fi

          packaged_name="$(
            helm show chart "${chart_package}" |
              awk '/^name:[[:space:]]/ { print tolower($2); exit }'
          )"

          packaged_version="$(
            helm show chart "${chart_package}" |
              awk '/^version:[[:space:]]/ { print $2; exit }'
          )"

          if [[ "${packaged_name}" != "${CHART_NAME}" ]]; then
            echo "::error::Packaged chart name mismatch. Expected=${CHART_NAME}, actual=${packaged_name}"
            exit 1
          fi

          if [[ "${packaged_version}" != "${CHART_VERSION}" ]]; then
            echo "::error::Packaged chart version mismatch. Expected=${CHART_VERSION}, actual=${packaged_version}"
            exit 1
          fi

          echo "package=${chart_package}" >> "${GITHUB_OUTPUT}"

      - name: Check immutable version
        id: remote
        shell: bash
        env:
          CHART_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail

          chart_ref="${OCI_REPOSITORY}/${CHART_NAME}"

          if helm show chart "${chart_ref}" \
            --version "${CHART_VERSION}" \
            >/dev/null 2>&1
          then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "${chart_ref}:${CHART_VERSION} already exists; immutable version will not be overwritten."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish missing chart version
        if: steps.remote.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail

          helm push \
            "${{ steps.package.outputs.package }}" \
            "${OCI_REPOSITORY}"

      - name: Pull and render upstream artifact
        shell: bash
        env:
          CHART_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail

          chart_ref="${OCI_REPOSITORY}/${CHART_NAME}"

          mkdir -p pulled

          pulled=false

          for attempt in 1 2 3 4 5 6; do
            if helm pull "${chart_ref}" \
              --version "${CHART_VERSION}" \
              --destination pulled
            then
              pulled=true
              break
            fi

            echo "Artifact is not visible yet (attempt ${attempt}/6)."
            sleep 5
          done

          if [[ "${pulled}" != "true" ]]; then
            echo "::error::Unable to pull ${chart_ref}:${CHART_VERSION}"
            exit 1
          fi

          pulled_package="$(
            find pulled \
              -maxdepth 1 \
              -type f \
              -name "*-${CHART_VERSION}.tgz" \
              -print \
              -quit
          )"

          if [[ -z "${pulled_package}" ]]; then
            echo "::error::Unable to find pulled package for ${CHART_NAME}:${CHART_VERSION}"
            exit 1
          fi

          mapfile -t set_values < <(
            jq -r '.[]' <<< "${SET_VALUES_JSON}"
          )

          helm_args=()

          for value in "${set_values[@]}"; do
            helm_args+=(--set-string "${value}")
          done

          helm show chart "${pulled_package}"

          helm template "component-byk-${CHART_NAME}" \
            "${pulled_package}" \
            --namespace ruuter \
            --kube-version 1.30.0 \
            "${helm_args[@]}" \
            >/dev/null
