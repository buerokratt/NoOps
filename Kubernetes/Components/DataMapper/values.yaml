
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
replicas: 1
podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

istio:
  enabled: {{ istio.enabled }}

domain: {{ domain.name }} # Domain name

ingress:
  certIssuerName: {{ cert.Issuer.Name }} # Change this if your certIssuerName has set up different

release_name: "component-byk-dmapper"
      

images:
  scope:
    registry: "ghcr.io"
    repository: buerokratt/datamapper
    tag: {{ component.datamapper.image.version }}
  backoffice:
    registry: "ghcr.io"
    repository: "buerokratt/buerokratt-dsl"
    tag: "{{ module.backoffice.image.version }}" # Images (tags) are up to date, currently no changes needed
  analytics:
    registry: "ghcr.io"
    repository: "buerokratt/buerokratt-dsl"
    tag: "{{ module.analytics.image.version }}" # Images (tags) are up to date, currently no changes needed
  services:
    registry: "ghcr.io"
    repository: "buerokratt/buerokratt-dsl"
    tag: "{{ module.services.image.version }}" # Images (tags) are up to date, currently no changes needed
  training:
    registry: "ghcr.io"
    repository: "buerokratt/buerokratt-dsl"
    tag: "{{ module.training.image.version }}" # Images (tags) are up to date, currently no changes needed 
  s3ferry:
    registry: "ghcr.io"
    repository: "buerokratt/s3-ferry"
    tag: "{{ component.s3.ferry.image.version }}" # Images (tags) are up to date, currently no changes needed
  pipelines:
    service:
      repo: https://github.com/buerokratt/Service-Module.git
      path: /DSL
  bot:
    dsl:
      repo: https://github.com/buerokratt/Training-Module.git
      path: DSL/DMapper/locations
  commonservice:
    dsl:
      repo: https://github.com/buerokratt/Common-Services.git
      path: /
  sec:
    service:
      repo: https://github.com/buerokratt/Service-Module.git
      path: /secrets

s3ferry:
  default:
    id: {{ S3_ACCESS_KEY_ID }}
    key: {{ S3_SECRET_ACCESS_KEY }}
    url: {{ S3_ENDPOINT_URL }}
  chats:
    id: admin
    key: {{ S3_SECRET_ACCESS_KEY }}
    url: {{ s3.domain.name }}

resources:
  requests:
    memory: "1000Mi"
    cpu: "100m"
  limits:
    memory: "2000Mi"
    cpu: "100m"

networkPolicy:
  cidr: 0.0.0.0/0
  except: []


global:
  opensearch:
    resources:
      TRAINING_RESPONSES_INDEX: "responses"
      TRAINING_INTENTS_INDEX: "intents"
      TRAINING_RULES_INDEX: "rules"
      TRAINING_STORIES_INDEX: "stories"
      TRAINING_TEST_STORIES_INDEX: "test-stories"
      TRAINING_FORMS_INDEX: "forms"
      TRAINING_ENTITIES_INDEX: "entities"
      TRAINING_REGEXES_INDEX: "regexes"
      TRAINING_EXAMPLES_ENTITIES_INDEX: "examples-entities"
      TRAINING_SLOTS_INDEX: "slots"
      TRAINING_CONFIG_INDEX: "config"
      TRAINING_NOTIFICATIONS_INDEX: "notifications"
      SERVICE_SERVICES_INDEX: "services"
      SERVICE_FAULTS_INDEX: "faults"
      SERVICE_RUUTERLOG_INDEX: "ruuterlog"
      SHARED_DOMAIN_INDEX: "domain"
      COMMON_COMPANIES_INDEX: "companies"
      OPENSEARCH_SCRIPT_PREFIX: ""
      COMMON_COMPANIES_INGEST_ENABLED: "false"
      COMMON_COMPANIES_PIPELINE: "companies-pipeline"
      COMMON_MUNICIPALITIES_INDEX: "municipalities"

opensearch:
  url: "http://component-opensearch-node:9200"
  credentialsSecret: "" # auth key; empty keeps existing script fallback.
