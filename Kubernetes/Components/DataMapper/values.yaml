nameOverride: component-byk-dmapper
fullnameOverride: component-byk-dmapper
release_name: component-byk-dmapper

replicaCount: 1
podAnnotations: {}

workload:
  kind: Deployment
  selectorLabels: {app: component-byk-dmapper}

image:
  repository: ghcr.io
  name: buerokratt/datamapper
  tag: "{{ component.datamapper.image.version }}"
  pullPolicy: IfNotPresent

containerPorts:
  - name: http
    containerPort: 3000

env: []

containerPorts:
  - {name: http, containerPort: 3000}
startupProbe:
  tcpSocket: {port: 3000}
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 24
  successThreshold: 1
readinessProbe:
  tcpSocket: {port: 3000}
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1
livenessProbe:
  tcpSocket: {port: 3000}
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1

services:
  http:
    name: component-byk-dmapper
    ports:
      http:
        port: 3000
        targetPort: http
        protocol: TCP


resources:
  requests: {cpu: 100m, memory: 200Mi}
  limits: {cpu: 100m, memory: 200Mi}

services:
  http:
    name: component-byk-dmapper
    ports:
      http: {port: 3000, targetPort: http}

ingress: {enabled: false}
istio: {enabled: false}