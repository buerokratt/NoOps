nameOverride: component-byk-dmapper
fullnameOverride: component-byk-dmapper

replicaCount: 1
podAnnotations: {}

workload:
  kind: Deployment
  selectorLabels: {app: component-byk-dmapper}

image:
  repository: ghcr.io
  name: buerokratt/datamapper
  tag: "{{ component.datamapper.image.version }}"
  pullPolicy: IfNotPresent

containerPorts:
  - name: http
    containerPort: 3000

env: []

containerPorts:
  - {name: http, containerPort: 3000}
startupProbe:
  httpGet:
    port: http
    path: /healthz
  periodSeconds: 5
  failureThreshold: 24
  initialDelaySeconds: 30

readinessProbe:
  httpGet:
    port: http
    path: /healthz
  periodSeconds: 5
  failureThreshold: 3

livenessProbe:
  httpGet:
    port: http
    path: /healthz
  periodSeconds: 10
  failureThreshold: 3

services:
  http:
    name: component-byk-dmapper
    ports:
      http:
        port: 3000
        targetPort: http
        protocol: TCP


resources:
  requests: {cpu: 100m, memory: 200Mi}
  limits: {cpu: 100m, memory: 200Mi}

services:
  http:
    name: component-byk-dmapper
    ports:
      http: {port: 3000, targetPort: http}

ingress: {enabled: false}
istio: {enabled: false}