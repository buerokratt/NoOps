apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "seaweedfs.fullname" . }}-master
  labels:
    {{- include "seaweedfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: master
spec:
  serviceName: {{ include "seaweedfs.fullname" . }}-master
  replicas: {{ .Values.master.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "seaweedfs.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "seaweedfs.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: master
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: master
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["weed"]
          args:
            - master
            - -ip=$(POD_IP)
            - -ip.bind=0.0.0.0
            - -port={{ .Values.master.port }}
            - -port.grpc={{ .Values.master.grpcPort }}
            - -mdir=/data
            - -volumeSizeLimitMB={{ .Values.master.volumeSizeLimitMB }}
            - -defaultReplication={{ .Values.master.defaultReplication }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: {{ .Values.master.port }}
            - name: grpc
              containerPort: {{ .Values.master.grpcPort }}
          readinessProbe:
            httpGet:
              path: /cluster/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /cluster/status
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            {{- toYaml .Values.master.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.master.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.master.persistence.size }}
