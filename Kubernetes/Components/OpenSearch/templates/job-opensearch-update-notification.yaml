{{- if .Values.bootstrap.enabled }}
{{- include "opensearch.bootstrap.validate" . }}

apiVersion: batch/v1
kind: Job
metadata:
  name: "job-{{ .Values.release_name }}-notification"
  annotations:
    "helm.sh/hook": post-install, post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  activeDeadlineSeconds: {{ .Values.bootstrap.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.bootstrap.backoffLimit }}
  template:
    metadata:
      name: "job-{{ .Values.release_name }}-notification"
    spec:
      initContainers:
       - name: wait-for-opensearch
         image: curlimages/curl:7.85.0
         command: ['sh', '-c', 'until curl --connect-timeout 5 --max-time 10 --fail --silent --show-error --user "$OPENSEARCH_AUTH" "$OPENSEARCH_URL"; do echo waiting for opensearch; sleep 5; done']
         env:
            {{- if .Values.bootstrap.caSecret }}
            - name: CURL_CA_BUNDLE
              value: /opensearch-ca/ca.crt
            {{- end }}
            - name: OPENSEARCH_URL
              value: {{ .Values.bootstrap.url | quote }}
            - name: OPENSEARCH_AUTH
              {{- if .Values.bootstrap.credentialsSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.credentialsSecret | quote }}
                  key: auth
              {{- else }}
              value: {{ .Values.bootstrap.auth | quote }}
              {{- end }}
         {{- if .Values.bootstrap.caSecret }}
         volumeMounts:
           - name: opensearch-ca
             mountPath: /opensearch-ca
             readOnly: true
         {{- end }}
       - name: opensearch-clone-notification
         image: alpine/git:2.36.3
         volumeMounts:
            - name: opensearch-repos
              mountPath: /root/backoffice
         command: ["/bin/sh"]
         args:
            - "-c"
            - >
              git clone $DSL_REPO /tmp/dsl-source && cd /tmp/dsl-source && git checkout "$DSL_REF" &&
              echo 'downloaded' &&
              cp -r /tmp/dsl-source/$DSL_PATH/fieldMappings /root/backoffice/ &&
              cp -r /tmp/dsl-source/$DSL_PATH/mock /root/backoffice/ &&
              cp -r /tmp/dsl-source/$DSL_PATH/deploy-opensearch.sh /root/backoffice/ &&
              echo 'moved' &&
              ls /root/backoffice
         env:
            - name: DSL_REF
              value: {{ .Values.images.opensearch.backoffice.ref | quote }}
            - name: DSL_REPO
              value: {{ .Values.images.opensearch.backoffice.repo }}
            - name: DSL_PATH
              value: {{ .Values.images.opensearch.backoffice.path }}

      containers:
        - name: opensearch-update-notification
          image: alpine
          command: ["/bin/sh"]
          args:
            - "-c"
            - >
              apk add --no-cache bash curl jq &&
              cd /backoffice &&
              bash deploy-opensearch.sh "$OPENSEARCH_URL" "$OPENSEARCH_AUTH"
          env:
             - name: CHATBOT_NOTIFICATION_INDEX
               value: {{ .Values.global.opensearch.indices.chatbotNotifications | quote }}
             - name: CHATBOT_CHATQUEUE_INDEX
               value: {{ .Values.global.opensearch.indices.chatbotChatQueue | quote }}
             {{- if .Values.bootstrap.caSecret }}
             - name: CURL_CA_BUNDLE
               value: /opensearch-ca/ca.crt
             {{- end }}
             - name: OPENSEARCH_URL
               value: {{ .Values.bootstrap.url | quote }}
             - name: OPENSEARCH_AUTH
               {{- if .Values.bootstrap.credentialsSecret }}
               valueFrom:
                 secretKeyRef:
                   name: {{ .Values.bootstrap.credentialsSecret | quote }}
                   key: auth
               {{- else }}
               value: {{ .Values.bootstrap.auth | quote }}
               {{- end }}
          volumeMounts:
            {{- if .Values.bootstrap.caSecret }}
            - name: opensearch-ca
              mountPath: /opensearch-ca
              readOnly: true
            {{- end }}
            - name: opensearch-repos
              mountPath: /backoffice

      volumes:
        {{- if .Values.bootstrap.caSecret }}
        - name: opensearch-ca
          secret:
            secretName: {{ .Values.bootstrap.caSecret | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        - name: opensearch-repos
          emptyDir: {}
      restartPolicy: Never

{{- end }}
