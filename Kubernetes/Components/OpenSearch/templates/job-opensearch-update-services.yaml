{{- if .Values.bootstrap.enabled }}
{{- include "opensearch.bootstrap.validate" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "job-{{ .Values.release_name }}-services"
  annotations:
    "helm.sh/hook": post-install, post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  activeDeadlineSeconds: {{ .Values.bootstrap.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.bootstrap.backoffLimit }}
  template:
    metadata:
      name: "job-{{ .Values.release_name }}-services"
    spec:
      initContainers:
       - name: wait-for-opensearch
         image: curlimages/curl:7.85.0
         command: ['sh', '-c', 'until curl --connect-timeout 5 --max-time 10 --fail --silent --show-error --user "$OPENSEARCH_AUTH" "$OPENSEARCH_URL"; do echo waiting for opensearch; sleep 5; done']
         env:
            {{- if .Values.bootstrap.caSecret }}
            - name: CURL_CA_BUNDLE
              value: /opensearch-ca/ca.crt
            {{- end }}
            - name: OPENSEARCH_URL
              value: {{ .Values.bootstrap.url | quote }}
            - name: OPENSEARCH_AUTH
              {{- if .Values.bootstrap.credentialsSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.credentialsSecret | quote }}
                  key: auth
              {{- else }}
              value: {{ .Values.bootstrap.auth | quote }}
              {{- end }}
         {{- if .Values.bootstrap.caSecret }}
         volumeMounts:
           - name: opensearch-ca
             mountPath: /opensearch-ca
             readOnly: true
         {{- end }}
       - name: opensearch-clone-services
         image: alpine/git:2.36.3
         volumeMounts:
            - name: opensearch-repos
              mountPath: /root/services
         command: ["/bin/sh"]
         args:
            - "-c"
            - >
              git clone $DSL_REPO /tmp/dsl-source && cd /tmp/dsl-source && git checkout "$DSL_REF" &&
              echo 'downloaded' &&
              cp -r /tmp/dsl-source/$DSL_PATH/fieldMappings /root/services/ &&
              cp -r /tmp/dsl-source/$DSL_PATH/mock /root/services/ &&
              cp -r /tmp/dsl-source/$DSL_PATH/templates /root/services/ &&
              cp -r /tmp/dsl-source/$DSL_PATH/deploy-opensearch.sh /root/services/ &&
              echo 'moved' &&
              ls /root/services
         env:
            - name: DSL_REF
              value: {{ .Values.images.opensearch.services.ref | quote }}
            - name: DSL_REPO
              value: {{ .Values.images.opensearch.services.repo }}
            - name: DSL_PATH
              value: {{ .Values.images.opensearch.services.path }}
      containers:      
       - name: opensearch-update-services
         image: alpine
         command: ["/bin/sh"]
         args:
            - "-c"
            - >
              apk add --no-cache bash curl jq &&
              cd /services &&
              bash deploy-opensearch.sh "$OPENSEARCH_URL" "$OPENSEARCH_AUTH"
         env:
            - name: TRAINING_RESPONSES_INDEX
              value: {{ index (.Values.global.opensearch.resources) "TRAINING_RESPONSES_INDEX" | quote }}
            - name: TRAINING_INTENTS_INDEX
              value: {{ index (.Values.global.opensearch.resources) "TRAINING_INTENTS_INDEX" | quote }}
            - name: TRAINING_RULES_INDEX
              value: {{ index (.Values.global.opensearch.resources) "TRAINING_RULES_INDEX" | quote }}
            - name: TRAINING_STORIES_INDEX
              value: {{ index (.Values.global.opensearch.resources) "TRAINING_STORIES_INDEX" | quote }}
            - name: TRAINING_TEST_STORIES_INDEX
              value: {{ index (.Values.global.opensearch.resources) "TRAINING_TEST_STORIES_INDEX" | quote }}
            - name: TRAINING_FORMS_INDEX
              value: {{ index (.Values.global.opensearch.resources) "TRAINING_FORMS_INDEX" | quote }}
            - name: TRAINING_ENTITIES_INDEX
              value: {{ index (.Values.global.opensearch.resources) "TRAINING_ENTITIES_INDEX" | quote }}
            - name: TRAINING_REGEXES_INDEX
              value: {{ index (.Values.global.opensearch.resources) "TRAINING_REGEXES_INDEX" | quote }}
            - name: TRAINING_EXAMPLES_ENTITIES_INDEX
              value: {{ index (.Values.global.opensearch.resources) "TRAINING_EXAMPLES_ENTITIES_INDEX" | quote }}
            - name: TRAINING_SLOTS_INDEX
              value: {{ index (.Values.global.opensearch.resources) "TRAINING_SLOTS_INDEX" | quote }}
            - name: TRAINING_CONFIG_INDEX
              value: {{ index (.Values.global.opensearch.resources) "TRAINING_CONFIG_INDEX" | quote }}
            - name: TRAINING_NOTIFICATIONS_INDEX
              value: {{ index (.Values.global.opensearch.resources) "TRAINING_NOTIFICATIONS_INDEX" | quote }}
            - name: SERVICE_SERVICES_INDEX
              value: {{ index (.Values.global.opensearch.resources) "SERVICE_SERVICES_INDEX" | quote }}
            - name: SERVICE_FAULTS_INDEX
              value: {{ index (.Values.global.opensearch.resources) "SERVICE_FAULTS_INDEX" | quote }}
            - name: SERVICE_RUUTERLOG_INDEX
              value: {{ index (.Values.global.opensearch.resources) "SERVICE_RUUTERLOG_INDEX" | quote }}
            - name: SHARED_DOMAIN_INDEX
              value: {{ index (.Values.global.opensearch.resources) "SHARED_DOMAIN_INDEX" | quote }}
            - name: COMMON_COMPANIES_INDEX
              value: {{ index (.Values.global.opensearch.resources) "COMMON_COMPANIES_INDEX" | quote }}
            - name: OPENSEARCH_SCRIPT_PREFIX
              value: {{ index (.Values.global.opensearch.resources) "OPENSEARCH_SCRIPT_PREFIX" | quote }}
            - name: COMMON_COMPANIES_PIPELINE
              value: {{ index (.Values.global.opensearch.resources) "COMMON_COMPANIES_PIPELINE" | quote }}
            {{- if .Values.bootstrap.caSecret }}
            - name: CURL_CA_BUNDLE
              value: /opensearch-ca/ca.crt
            {{- end }}
            - name: OPENSEARCH_URL
              value: {{ .Values.bootstrap.url | quote }}
            - name: OPENSEARCH_AUTH
              {{- if .Values.bootstrap.credentialsSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.credentialsSecret | quote }}
                  key: auth
              {{- else }}
              value: {{ .Values.bootstrap.auth | quote }}
              {{- end }}
         volumeMounts:
            {{- if .Values.bootstrap.caSecret }}
            - name: opensearch-ca
              mountPath: /opensearch-ca
              readOnly: true
            {{- end }}
            - name: opensearch-repos
              mountPath: /services

      volumes:
        {{- if .Values.bootstrap.caSecret }}
        - name: opensearch-ca
          secret:
            secretName: {{ .Values.bootstrap.caSecret | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        - name: opensearch-repos
          emptyDir: {}
      restartPolicy: Never



{{- end }}
