{{- if .Values.loaders.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "job-{{ .Release.Name }}-services"
  annotations:
    "helm.sh/hook": post-install, post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
#  ttlSecondsAfterFinished: 120
  template:
    metadata:
      name: "job-{{ .Release.Name }}-services"
    spec:
      initContainers:
       - name: wait-for-opensearch
         image: {{ .Values.loaders.images.curl | quote }}
         command: ['sh', '-c', 'until curl -sf $OPENSEARCH_CURL_TLS_ARGS -u "$OPENSEARCH_USERNAME:$OPENSEARCH_PASSWORD" "$OPENSEARCH_ENDPOINT"; do echo waiting for opensearch; sleep 5; done']
         env:
           - {name: OPENSEARCH_ENDPOINT, value: {{ .Values.loaders.endpoint | quote }}}
           - {name: OPENSEARCH_USERNAME, value: {{ .Values.loaders.credentials.username | quote }}}
           - {name: OPENSEARCH_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.loaders.credentials.secretName }}, key: {{ .Values.loaders.credentials.passwordKey }}}}}
           - {name: OPENSEARCH_CURL_TLS_ARGS, value: {{ .Values.loaders.tls.curlArgs | quote }}}
       - name: opensearch-clone-services
         image: {{ .Values.loaders.images.git | quote }}
         volumeMounts:
            - name: opensearch-repos
              mountPath: /root/services
         command: ["/bin/sh"]
         args:
            - "-c"
            - >
              git clone $DSL_REPO /tmp/dsl-source && cd /tmp/dsl-source && git checkout main &&
              echo 'downloaded' &&
              cp -r /tmp/dsl-source/$DSL_PATH/fieldMappings /root/services/ &&
              cp -r /tmp/dsl-source/$DSL_PATH/mock /root/services/ &&
              cp -r /tmp/dsl-source/$DSL_PATH/templates /root/services/ &&
              cp -r /tmp/dsl-source/$DSL_PATH/deploy-opensearch.sh /root/services/ &&
              echo 'moved' &&
              ls /root/services
         env:
            - name: DSL_REPO
              value: {{ .Values.images.opensearch.services.repo }}
            - name: DSL_PATH
              value: {{ .Values.images.opensearch.services.path }}
      containers:      
       - name: opensearch-update-services
         image: {{ .Values.loaders.images.curl | quote }}
         command: ["/bin/sh"]
         args:
            - "-c"
            - >
              printf '%s\n' "$OPENSEARCH_CURL_CONFIG" > "$CURL_HOME/.curlrc" &&
              cd /services &&
              sh deploy-opensearch.sh "$OPENSEARCH_ENDPOINT" "$OPENSEARCH_USERNAME:$OPENSEARCH_PASSWORD"
         env:
           - {name: OPENSEARCH_ENDPOINT, value: {{ .Values.loaders.endpoint | quote }}}
           - {name: OPENSEARCH_USERNAME, value: {{ .Values.loaders.credentials.username | quote }}}
           - {name: OPENSEARCH_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.loaders.credentials.secretName }}, key: {{ .Values.loaders.credentials.passwordKey }}}}}
           - {name: OPENSEARCH_CURL_CONFIG, value: {{ .Values.loaders.tls.curlConfig | quote }}}
           - {name: CURL_HOME, value: /tmp}
         volumeMounts:
            - name: opensearch-repos
              mountPath: /services

      volumes:
        - name: opensearch-repos
          emptyDir: {}
      restartPolicy: Never
{{- end }}
