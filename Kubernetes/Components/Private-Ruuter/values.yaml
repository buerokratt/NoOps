nameOverride: component-byk-ruuter-private
fullnameOverride: component-byk-ruuter-private
replicaCount: 1
 
workload:
  kind: Deployment
  selectorLabels: {app: component-byk-ruuter-private}
 
image:
  repository: ghcr.io
  name: buerokratt/ruuter
  tag: v2.2.8
  pullPolicy: IfNotPresent
 
containerPorts:
  - {name: http, containerPort: 8080}
 
env:
  - {name: logging.level.root, value: INFO}
  - {name: LOG_LEVEL_TIMING, value: INFO}
  - {name: application.logging.displayRequestContent, value: "false"}
  - {name: application.logging_displayResponseContent, value: "false"}
  - {name: application.DSL.allowedFiletypes, value: ".yml,.yaml,.md,.tmp"}
  - {name: application.internalRequests.disabled, value: "true"}
  - {name: application.logging.printStackTrace, value: "true"}
  - {name: application.httpResponseSizeLimit, value: "2000"}
  - {name: application.openSearchConfiguration.index, value: ruuterlog}
  - {name: application.httpRequestTimeout, value: "35000"}
 
initContainers:
  - name: init-copy-files
    image: ghcr.io/buerokratt/buerokratt-dsl@sha256:2123520e334160ba971d90fe802ecc8aeb2e8de766d935c0365cba12423130bc
    imagePullPolicy: IfNotPresent
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -eu
        test -d /Ruuter/private/backoffice
        cp -a /Ruuter/private/backoffice /DSL/
        test -n "$(find /DSL/backoffice -type f -print -quit)"
    volumeMounts:
      - {name: ruuter-volume, mountPath: /DSL}
 
volumeMounts:
  - {name: ruuter-volume, mountPath: /DSL}
  - {name: urls-env, mountPath: /app/constants.ini, subPath: constants.ini, readOnly: true}
 
volumes:
  - {name: ruuter-volume, emptyDir: {}}
  - {name: urls-env, configMap: {name: urls-env-config-private}}
 
startupProbe:
  httpGet:
    port: http
    path: /healthz
  periodSeconds: 5
  failureThreshold: 24
  initialDelaySeconds: 30

readinessProbe:
  httpGet:
    port: http
    path: /healthz
  periodSeconds: 5
  failureThreshold: 3

livenessProbe:
  httpGet:
    port: http
    path: /healthz
  periodSeconds: 10
  failureThreshold: 3
 
resources:
  requests: {cpu: 250m, memory: 1000Mi}
  limits: {cpu: 250m, memory: 1000Mi}
 
services:
  http:
    name: component-byk-ruuter-private
    ports:
      http: {port: 8080, targetPort: http, protocol: TCP}
 
ingress: {enabled: false}
istio: {enabled: false}
 
constantsIni: |
  DOMAIN=example.invalid
  COOKIE_SAME_SITE=Lax
  # Add only non-secret values needed by the smoke route.

