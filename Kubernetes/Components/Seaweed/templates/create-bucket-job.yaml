apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-create-buckets
  labels:
    app: seaweedfs-create-buckets
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded

spec:
  backoffLimit: 10

  template:
    metadata:
      labels:
        app: seaweedfs-create-buckets

    spec:
      restartPolicy: OnFailure

      containers:
        - name: create-buckets
          image: amazon/aws-cli:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.s3.credentials.accessKey | quote }}

            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.s3.credentials.secretKey | quote }}

            - name: AWS_DEFAULT_REGION
              value: "us-east-1"

          command:
            - /bin/sh
            - -c

          args:
            - |
              set -e

              ENDPOINT="http://seaweedfs-s3:{{ .Values.s3.port }}"

              echo "Waiting for SeaweedFS S3..."

              until aws \
                --endpoint-url "$ENDPOINT" \
                s3api list-buckets >/dev/null 2>&1;
              do
                echo "SeaweedFS S3 is not ready yet..."
                sleep 5
              done

              echo "SeaweedFS S3 is ready."

              {{- range .Values.s3.buckets }}

              echo "Checking bucket '{{ . }}'..."

              if aws \
                --endpoint-url "$ENDPOINT" \
                s3api head-bucket \
                --bucket "{{ . }}" >/dev/null 2>&1;
              then
                echo "Bucket '{{ . }}' already exists."
              else
                echo "Creating bucket '{{ . }}'..."

                aws \
                  --endpoint-url "$ENDPOINT" \
                  s3api create-bucket \
                  --bucket "{{ . }}"

                echo "Bucket '{{ . }}' created."
              fi

              {{- end }}

              echo "Bucket initialization completed."