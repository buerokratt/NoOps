{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: "{{ include "template-library.fullname" . }}"
spec:
  host: "{{ include "template-library.fullname" . }}"
  subsets:
  - name: "{{ include "template-library.fullname" . }}"
    labels:
      {{- include "template-library.selectorLabels" . | nindent 6 }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: "{{ include "template-library.fullname" . }}"
spec:
  hosts:
  - "{{ include "template-library.fullname" . }}"
  http:
  - name: allow
    match:
    - sourceLabels:
        app: component-byk-ruuter
    - sourceLabels:
        app: component-byk-ruuter-private
    route:
    - destination:
        host: "{{ include "template-library.fullname" . }}"
        subset: "{{ include "template-library.fullname" . }}"
  - name: reject
    route:
    - destination:
        host: "{{ include "template-library.fullname" . }}"
        subset: "{{ include "template-library.fullname" . }}"
    fault:
      abort:
        percentage:
          value: 100.0
        httpStatus: 403
{{- end }}
