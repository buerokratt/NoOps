enabled: true # Disable this release when using a separately managed Central Vault.

nameOverride: ""
fullnameOverride: ""

image:
  repository: hashicorp/vault
  tag: "1.21.3"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8200

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  # Match the immutable claim template of existing releases. For a release
  # first installed from phase 6/7 without this label, explicitly set "".
  claimTemplateChartLabel: "buerokratt-vault-0.2.0"
  accessModes:
    - ReadWriteOnce

resources: {}

podSecurityContext:
  fsGroup: 1000

containerSecurityContext:
  runAsUser: 0
  runAsNonRoot: false
  capabilities:
    add:
      - IPC_LOCK

vaultConfig: |
  ui = true
  api_addr = "http://0.0.0.0:8200"
  disable_mlock = true

  listener "tcp" {
    address     = "0.0.0.0:8200"
    tls_disable = 1
  }

  storage "file" {
    path = "/vault/data"
  }

bootstrap:
  enabled: true

  kvMount: secret
  approleMount: approle

  # One entry per AppRole this Vault should provision.
  #
  #   name            - AppRole name
  #   policyName      - ACL policy name bound to the role
  #   tokenPeriod     - periodic token period (renewed forever, no max_ttl)
  #   secretName      - Kubernetes Secret holding role_id/secret_id
  #   secretNamespace - namespace that Secret is written to. Leave empty for the
  #                     release namespace. Set it to the CONSUMING workload's
  #                     namespace when Vault runs somewhere else - a Secret cannot
  #                     be mounted across namespaces.
  #   policy          - the ACL policy body (HCL)
  #
  # The default below reproduces the single-role backoffice setup exactly, so
  # upgrading an existing release with default values is a no-op.
  roles:
    - name: backoffice-service
      policyName: backoffice-admin-policy
      tokenPeriod: 1h
      secretName: backoffice-vault-approle
      secretNamespace: ""
      # This policy covers paths used by PR #2088, including:
      # secret/data/backoffice/<domain>/azure-agentic
      policy: |
        path "secret/data/backoffice/*" {
          capabilities = ["create", "read", "update", "delete"]
        }

        path "secret/metadata/backoffice/*" {
          capabilities = ["read", "list", "delete"]
        }

  # Modules that need an RSA-2048 keypair generated at
  # secret/<module>/encryption/{public_key,private_key}.
  # Generated only when absent - never regenerated, since that would silently
  # break decryption of anything already encrypted with the old public key.
  modules: []

  image:
    repository: hashicorp/vault
    tag: "1.21.3"
    pullPolicy: IfNotPresent

  resources: {}

  # Development-compatible automatic initialization/unseal.
  # For production, replace this with KMS/HSM auto-unseal.
  init:
    secretShares: 1
    secretThreshold: 1

networkPolicy:
  enabled: false
  # When enabled, add selectors that are allowed to access Vault.
  ingressFrom: []
