{{- if .Values.bootstrap.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "buerokratt-vault.fullname" . }}
  labels:
    {{- include "buerokratt-vault.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "buerokratt-vault.fullname" . }}-credentials
  labels:
    {{- include "buerokratt-vault.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.bootstrap.credentialsSecretName }}
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "buerokratt-vault.fullname" . }}-credentials
  labels:
    {{- include "buerokratt-vault.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "buerokratt-vault.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "buerokratt-vault.fullname" . }}-credentials
{{- end }}
