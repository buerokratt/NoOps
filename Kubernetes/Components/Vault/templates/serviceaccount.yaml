{{- if .Values.enabled }}
{{- if .Values.bootstrap.enabled }}
{{- $root := . }}
{{- $namespaces := list }}
{{- range .Values.bootstrap.roles }}
{{- $namespaces = append $namespaces (.secretNamespace | default $root.Release.Namespace) }}
{{- end }}
{{- $namespaces = $namespaces | uniq }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "buerokratt-vault.fullname" . }}
  labels:
    {{- include "buerokratt-vault.labels" . | nindent 4 }}
{{- /*
  One Role + RoleBinding per namespace that receives a credentials Secret.
  The bootstrap ServiceAccount lives in the release namespace but must be able to
  write Secrets into each consuming workload's namespace, because a Secret cannot
  be mounted across namespaces. Deliberately namespaced Roles rather than a
  ClusterRole - a ClusterRole would grant Secret write access cluster-wide.
  Every namespace listed here must already exist at install time.
*/}}
{{- range $ns := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "buerokratt-vault.fullname" $ }}-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "buerokratt-vault.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
    {{- range $root.Values.bootstrap.roles }}
    {{- if eq (.secretNamespace | default $root.Release.Namespace) $ns }}
      - {{ .secretName }}
    {{- end }}
    {{- end }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "buerokratt-vault.fullname" $ }}-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "buerokratt-vault.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "buerokratt-vault.fullname" $ }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "buerokratt-vault.fullname" $ }}-credentials
{{- end }}
{{- end }}
{{- end }}
