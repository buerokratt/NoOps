  REACT_APP_SERVICE_ID: "training"
  REACT_APP_RUUTER_PRIVATE_API_URL: "https://ruuter.{{ .Values.domain }}/v2/private/backoffice" 
  REACT_APP_BASE_URL: "byrokratt/"
  REACT_APP_SERVICE_MODULE_GUI_BASE_URL: "https://admin.{{ .Values.domain }}/services/" 
  REACT_APP_NODE_ENV: "development"
  REACT_APP_RUUTER_URL: "https://ruuter.{{ .Values.domain }}/v2/private/training/" 
