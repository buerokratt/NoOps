release_name: "module-byk-training-gui"
images:
  gui:
    registry: "ghcr.io"
    repository: "buerokratt/training-module"
    tag: "v1.1.1"
  dsl:
    registry: "ghcr.io"
    repository: "buerokratt/buerokratt-dsl"
    tag: "v1.1.1"
  pipelines:
    registry: "ghcr.io"
    repository: "buerokratt/training-module"
    tag: "v1.1.1"
    

