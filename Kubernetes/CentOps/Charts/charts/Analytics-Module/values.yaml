domain: "test.buerokratt.ee"
secretname: "vaartus"

ingress:
  whitelistSourceRange: ""

release_name: "module-byk-analytics-gui"

images:
  gui:
    registry: "ghcr.io"
    repository: "buerokratt/analytics-module"
    tag: "v1.1.1" 
  dsl:
    registry: "ghcr.io"
    repository: "buerokratt/buerokratt-dsl"
    tag: "v1.1.1"
env:
  REACT_APP_RUUTER_API_URL: "https://ruuter.{{ .Values.domain }}/v2/public/backoffice"
  NODE_ENV: "development"
  CHOKIDAR_USEPOLLING: "true"
  REACT_APP_API_URL: "https://ruuter.{{ .Values.domain }}/v2/private/analytics"
  REACT_APP_BUEROKRATT_CHATBOT_URL: "http://byk-bot:5005"
  REACT_APP_OPENSEARCH_DASHBOARD_URL: "https://opensearch.org/"
  REACT_APP_OPENDATAPORT_URL: "http://avaandmedtest.eesti.ee"
  REACT_APP_RUUTER_V2_PRIVATE_API_URL: "https://ruuter.{{ .Values.domain }}/v2/private/backoffice"
  REACT_APP_RUUTER_V2_ANALYTICS_API_URL: "https://ruuter.{{ .Values.domain }}/v2/private/analytics" 
  REACT_APP_MENU_URL: "https://admin.{{ .Values.domain }}"
  REACT_APP_MENU_PATH: "/chat/menu.json"
  REACT_APP_AUTH_BASE_URL: "https://ruuter.{{ .Values.domain }}/v2/private/backoffice"
  REACT_APP_APP_PORT: "3001"
  REACT_APP_LOCAL: "false"
  REACT_APP_DOCKER_RUUTER: "http://byk-ruuter-private:8080"
  REACT_APP_CUSTOMER_SERVICE_LOGIN: "https://admin.{{ .Values.domain }}/et/dev-auth"
  REACT_APP_CONVERSATIONS_BASE_URL: "https://admin.{{ .Values.domain }}/chat"
  REACT_APP_TRAINING_BASE_URL: "https://admin.{{ .Values.domain }}/training"
  REACT_APP_ANALYTICS_BASE_URL: "https://admin.{{ .Values.domain }}/analytics"
  REACT_APP_SERVICES_BASE_URL: "https://admin.{{ .Values.domain }}/services"
  REACT_APP_SETTINGS_BASE_URL: "https://admin.{{ .Values.domain }}/chat"
  REACT_APP_MONITORING_BASE_URL: "https://admin.{{ .Values.domain }}/monitoring"
  REACT_APP_SERVICE_ID: "analytics"
  REACT_APP_RUUTER_PRIVATE_API_URL: "https://ruuter.{{ .Values.domain }}/v2/private/backoffice"
  REACT_APP_BASE_API_PATH: "https://ruuter.{{ .Values.domain }}/v2/private/backoffice" 
  REACT_APP_NOTIFICATION_NODE_URL: "https://ruuter.{{ .Values.domain }}"


liquibase:
  jdbcUrl: "jdbc:postgresql://component-databases-users-db:5432/byk?user=byk"    
  dbPassword: "{{ usersDB.password }}"   # Change password accordingly

resources:
  requests:
    memory: "10Mi"
    cpu: "1m"
  limits:
    memory: "50Mi"
    cpu: "10m"
