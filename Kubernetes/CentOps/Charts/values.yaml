Ruuter:
  release_name: "ruuteritest"
  domain: "eexample.com"
  images:
    scope:
      registry: "ghcr.io"
      repository: "buerokratt/ruuter"
      tag: "v2.2.2"
  certIssuerName: "letsencrypt-prod"
  secretname: "ruuter.stage.buerokratt.ee0001"
  env:
    cors: "https://xample.com"
    sizelimit: "3000"
Resql:
  istio:
    enabled: false
  domain: "eexample.com"

  release_name: "component-byk-resql"
  release_db: "component-databases" 

  images:
    scope:
      registry: "ghcr.io"
      repository: "buerokratt/resql"
      tag: "v1.3.4" 
    backoffice:
      registry: "ghcr.io"
      repository: "buerokratt/buerokratt-dsl"
      tag: "backoffice-module-test-1.5.19" 
    analytics:
      registry: "ghcr.io"
      repository: "buerokratt/buerokratt-dsl"
      tag: "analytics-module-test-1.5.11" 
    services:
      registry: "ghcr.io"
      repository: "buerokratt/buerokratt-dsl"
      tag: "service-module-test-1.5.20" 
    training:
      registry: "ghcr.io"
      repository: "buerokratt/buerokratt-dsl"
      tag: "training-module-test-1.5.18" 
      
  env:
    LOGGING_LEVEL_ROOT: "INFO"
    SQLMS_DATASOURCES_0_NAME: "byk"
    SQLMS_DATASOURCES_0_JDBCURL: "jdbc:postgresql://component-databases-users-db:5432/byk"
    SQLMS_DATASOURCES_0_USERNAME: "byk"
    SQLMS_DATASOURCES_0_PASSWORD: ""
    LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT: "DEBUG"

  resources:
    requests:
      memory: "1000Mi"
      cpu: "50m"
    limits:
      memory: "2000Mi"
      cpu: "50m"

Databases:
  domain: "eexample.com"
  releaseName: "component-databases"
  tim-postgresql:
    image:
      tag: 14.1.0
    auth:
      postgresPassword: postgres
      username: tim
      password: "{{ TIMDB.password }}"
      database: tim
    statefulset:
      enabled: true
      replicaCount: 1
      persistence:
        storageClass: longhorn
        enabled: true
        size: 1Gi
  users-db:
    image:
      tag: 14.1.0
    auth:
      postgresPassword: postgres
      username: byk
      password: "{{ usersDB.password }}"
    statefulset:
      enabled: true
      replicaCount: 1
      persistence:
        storageClass: longhorn
        enabled: true
        size: 1Gi

Buerokratt-Chatbot:
  domain: "example.com"
  secretname: "certname"

  ingress:
    whitelistSourceRange: ""
    urlnameruuter: "https://ruuter.test.example.ee"
    urlnametim: "https://tim.test.example.ee"
    urlnameadmin: "https://admin.test.example.ee"
    
  release_name: "module-byk-backoffice-gui"

  images:
    gui:
      registry: "ghcr.io"
      repository: "buerokratt/buerokratt-chatbot"
      tag: "v1.1.1"
    dsl:
      registry: "ghcr.io"
      repository: "buerokratt/buerokratt-dsl"
      tag: "v1.1.1"
    liquibase:
      dsl:
        repo: https://github.com/buerokratt/Buerokratt-Chatbot.git
        path: DSL/Liquibase

  env:
    REACT_APP_RUUTER_API_URL: "https://ruuter.test.example.ee/v2/public/backoffice"
    REACT_APP_RUUTER_PRIVATE_API_URL: "https://ruuter.test.example.ee/v2/private/backoffice"
    REACT_APP_BUEROKRATT_CHATBOT_URL: "https://admin.test.example.ee/chat"
    REACT_APP_MENU_URL: "https://admin.test.example.ee"
    REACT_APP_MENU_PATH: "/chat/menu.json"
    REACT_APP_CUSTOMER_SERVICE_LOGIN: "https://admin.test.example.ee/et/log-in"
    DOMAIN: "test.example.ee"
    REACT_APP_CONVERSATIONS_BASE_URL: "https://admin.test.example.ee/chat"
    REACT_APP_TRAINING_BASE_URL: "https://admin.test.example.ee/training"
    REACT_APP_ANALYTICS_BASE_URL: "https://admin.test.example.ee/analytics"
    REACT_APP_SERVICES_BASE_URL: "https://admin.test.example.ee/services"
    REACT_APP_SETTINGS_BASE_URL: "https://admin.test.example.ee/settings"
    REACT_APP_MONITORING_BASE_URL: "https://admin.test.example.ee/monitoring"
    REACT_APP_SERVICE_ID: "conversations,settings,monitoring"
    REACT_APP_NOTIFICATION_NODE_URL: "https://ruuter.test.example.ee"


  liquibase:
    jdbcUrl: "jdbc:postgresql://test-buerokratt-users-db.test2.svc.cluster.local:5432/byk?user=byk"    
    dbPassword: ""

  resources:
    requests:
      memory: "10Mi"
      cpu: "1m"
    limits:
      memory: "50Mi"
      cpu: "5m"