{{- $seed := .Values.cleaningServer.vault.seed }}
{{- if and .Values.cleaningServer.enabled .Values.cleaningServer.vault.enabled $seed.enabled (not (contains "{{" $seed.apiKey)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cleaningServer.nameOverride }}-vault-seed
type: Opaque
stringData:
  api_key: {{ $seed.apiKey | quote }}
{{- end }}
