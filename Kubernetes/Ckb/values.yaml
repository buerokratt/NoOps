# --- Liquibase --------------------------------------------------------
liquibase:
  enabled: true
  backoffLimit: 3
  image:
    repository: liquibase/liquibase
    tag: "4.33.0"
    pullPolicy: IfNotPresent
  repo: "https://github.com/buerokratt/Buerokratt-DSL.git"
  branch: "{{ ckb.liquibase.branch }}"
  path: "Liquibase/ckb"
  dbHost: "component-databases-users-db"
  dbName: "byk"
  dbPassword: "{{ usersDB.password }}"

# --- File Processing API --------------------------------------------------------
fileProcessing:
  enabled: true
  nameOverride: file-processing-api
  # Release the existing RWO mounts before starting the replacement Pod.
  strategy:
    type: Recreate
    rollingUpdate: null
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: "{{ ckb.fileproc.image.version }}"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8888
  ingress:
    enabled: true
    className: ""
    hosts: []
    tls: []
  env:
    - name: AWS_ACCESS_KEY_ID
      value: "{{ ckb.s3.access.key.id }}"
    - name: AWS_SECRET_ACCESS_KEY
      value: "{{ ckb.s3.secret.access.key }}" # Password
    - name: AWS_REGION
      value: "{{ ckb.s3.region }}"
    - name: S3_BUCKET_NAME
      value: "{{ ckb.s3.bucket.name }}"
    - name: S3_ENDPOINT_URL
      value: "{{ ckb.s3.endpoint.url }}" #s3 url
    - name: SOURCE_PATH
      value: ""
    - name: S3_PRESIGNED_URL_EXPIRATION
      value: "3600"
    - name: S3_UPLOAD_URL_EXPIRATION
      value: "3600"
    - name: AUTO_CLEANUP_COMPLETED_TASKS
      value: "true"
    - name: COMPLETED_TASK_CLEANUP_DELAY_MINUTES
      value: "5"
    - name: PERIODIC_CLEANUP_INTERVAL_MINUTES
      value: "60"
    - name: MAX_TASK_AGE_HOURS
      value: "24"
  probes:
    path: /docs
    initialDelaySeconds: 40
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  persistence:
    enabled: true
    size: 1Gi
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

# --- Ruuter (internal) ---------------------------------------------------------
ruuterInternal:
  enabled: true
  ingress:
    enabled: false
    host: "ruuter.{{ domain.name }}"
    annotations:
      kubernetes.io/ingress.class: "nginx"
      cert-manager.io/cluster-issuer: "{{ cert.Issuer.Name }}"
    tlsSecret: ruuter-tls
  nameOverride: ruuter-internal
  image:
    repository: ghcr.io/buerokratt/ruuter
    tag: "{{ ckb.ruuter.internal.image.version }}"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8089
  env:
    - name: application.cors.allowedOrigins
      value: "http://localhost:8086,http://localhost:8089,http://localhost:3001,http://localhost:3003,http://localhost:3004,http://localhost:8080"
    - name: application.httpCodesAllowList
      value: "200,201,202,400,401,403,500"
    - name: application.internalRequests.allowedIPs
      value: "127.0.0.1"
    - name: application.logging.displayRequestContent
      value: "true"
    - name: application.logging.displayResponseContent
      value: "true"
    - name: application.logging.printStackTrace
      value: "true"
    - name: application.internalRequests.disabled
      value: "true"
    - name: server.port
      value: "8089"
  config:
    constantsIni: |-
      configmap somehow
  volumes:
    mountConstantsIni: true
    mountDSL: false
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

# --- Data Export ---------------------------------------------------------------
dataExport:
  enabled: true
  nameOverride: data-export
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: "{{ ckb.data.export.image.version }}"
    pullPolicy: IfNotPresent
  command: ["python", "debug.py"]
  service:
    type: ClusterIP
    port: 8889
    targetPort: 8888
  env:
    - name: DB_URI
      value: "postgresql://byk:{{ usersDB.password }}@component-databases-users-db:5432/byk"
  volumes:
    enabled: false
  extraVolumes: []
  extraVolumeMounts: []

# --- GUI (React) ---------------------------------------------------------------
