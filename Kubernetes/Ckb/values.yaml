# --- Search Service ------------------------------------------------------------
searchService:
  enabled: true
  nameOverride: search-service
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: "{{ ckb.search.image.version }}"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    externalPort: 3009
  env:
    - name: OPENSEARCH_URL
      value: "http://component-opensearch-node:9200"
    - name: DATA_PATH
      value: "/app/data"
    - name: PORT
      value: "3000"
  volumes:
    enabled: false
  extraVolumes: []
  extraVolumeMounts: []
  restartPolicy: Always

# --- Scrapper (server & celery) -----------------------------------------------
scrapperServer:
  enabled: true
  nameOverride: scrapper-server
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: "{{ ckb.scrapper.server.image.version }}"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  env:
    - name: RUUTER_INTERNAL
      value: "http://ruuter-internal:8089"
    - name: BROKER_URL
      value: "pyamqp://{{ ckb.rabbitmq.user }}:{{ ckb.rabbitmq.password }}@rabbit-scrapper/scrapper"
  volumes:
    enabled: false
  extraVolumes: []
  extraVolumeMounts: []
  dependsOn:
    rabbitmq: true

scrapperCelery:
  enabled: true
  nameOverride: scrapper-celery
  image: 
    repository: ghcr.io/buerokratt/common-knowledge
    tag: "{{ ckb.scrapper.celery.image.version }}"
    pullPolicy: IfNotPresent
  env:
    - name: RUUTER_INTERNAL
      value: "http://ruuter-internal:8089"
    - name: BROKER_URL
      value: "pyamqp://{{ ckb.rabbitmq.user }}:{{ ckb.rabbitmq.password }}@rabbit-scrapper/scrapper"
  volumes:
    enabled: false
  extraVolumes: []
  extraVolumeMounts: []

# --- Cleaning Server -----------------------------------------------------------
cleaningServer:
  enabled: true
  nameOverride: cleaning-server
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: "{{ ckb.cleaner.image.version }}"
    pullPolicy: IfNotPresent
  # The cleaner image starts uvicorn through its own CMD.
  command: []
  service:
    type: ClusterIP
    port: 8123
  env:
    - name: RUUTER_INTERNAL
      value: "http://ruuter-internal:8089"
    - name: BROKER_URL
      value: "pyamqp://{{ ckb.rabbitmq.user }}:{{ ckb.rabbitmq.password }}@rabbit-scrapper/scrapper"
  volumes:
    enabled: true
  extraVolumes: []
  extraVolumeMounts: []
  vault:
    enabled: true
    address: "{{ ckb.vault.address }}"
    secretPath: ckb/llm/connections/azure_openai/cleaner
    approleSecretName: ckb-cleaner-approle
    seed:
      enabled: true
      approleSecretName: ckb-cleaner-seed-approle
      apiKey: "{{ ckb.cleaner.azure.api.key }}"
      endpoint: "{{ ckb.cleaner.azure.endpoint }}"
      deployment: "{{ ckb.cleaner.azure.deployment }}"
      apiVersion: "{{ ckb.cleaner.azure.api.version }}"
    agentImage:
      repository: hashicorp/vault
      tag: "1.21.3"
      pullPolicy: IfNotPresent

# --- RabbitMQ (scrapper) -------------------------------------------------------
rabbitmq:
  enabled: true
  nameOverride: rabbit-scrapper
  image:
    repository: rabbitmq
    tag: 4-management
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    amqpPort: 5672
    uiPort: 15672
  env:
    - name: RABBITMQ_DEFAULT_USER
      value: "{{ ckb.rabbitmq.user }}"
    - name: RABBITMQ_DEFAULT_PASS
      value: "{{ ckb.rabbitmq.password }}"
    - name: RABBITMQ_DEFAULT_VHOST
      value: "scrapper"

# --- Scheduler -----------------------------------------------------------------
scheduler:
  enabled: true
  nameOverride: scheduler
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: "{{ ckb.scheduler.image.version }}"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8124
