{{- if and .Values.enabled .Values.volumes.logs.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ .Values.release_name }}-logs"
  labels:
    app: "{{ .Values.release_name }}"
    component: llm-orchestration
    type: logs
spec:
  accessModes:
    - {{ .Values.volumes.logs.accessMode }}
  resources:
    requests:
      storage: {{ .Values.volumes.logs.size }}
  {{- if .Values.volumes.logs.storageClass }}
  storageClassName: {{ .Values.volumes.logs.storageClass }}
  {{- end }}
{{- end }}

