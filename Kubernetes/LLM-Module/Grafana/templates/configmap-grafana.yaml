apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    {{- range .Values.datasources }}
    - name: {{ .name }}
      type: {{ .type }}
      url: {{ .url }}
      access: {{ .access }}
      isDefault: {{ .isDefault }}
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    {{- range .Values.dashboardProviders }}
    - name: {{ .name }}
      orgId: {{ .orgId }}
      folder: '{{ .folder }}'
      type: {{ .type }}
      disableDeletion: {{ .disableDeletion }}
      updateIntervalSeconds: {{ .updateIntervalSeconds }}
      allowUiUpdates: {{ .allowUiUpdates }}
      options:
        path: {{ .options.path }}
    {{- end }}