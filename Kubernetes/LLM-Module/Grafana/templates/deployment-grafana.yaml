apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.release_name }}
  labels:
    app: {{ .Values.release_name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.release_name }}
  template:
    metadata:
      labels:
        app: {{ .Values.release_name }}
    spec:
      # Grafana UID/GID
      podSecurityContext:
        runAsUser: 472
        fsGroup: 472

      # InitContainer to fix PVC permissions
      initContainers:
        - name: init-grafana-storage
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "Fixing /var/lib/grafana permissions"
              mkdir -p /var/lib/grafana/plugins /var/lib/grafana/dashboards
              chown -R 472:472 /var/lib/grafana
              chmod -R 755 /var/lib/grafana
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana

      containers:
        - name: {{ .Values.release_name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          # Non-sensitive env's from values.yaml
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          # Sensitive env's from Kubernetes Secret
          {{- if .Values.envFrom }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: storage
              mountPath: /var/lib/grafana
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: dashboards
          configMap:
            name: grafana-dashboards
        {{- if .Values.persistence.enabled }}
        - name: storage
          persistentVolumeClaim:
            claimName: grafana-storage
        {{- end }}
      
