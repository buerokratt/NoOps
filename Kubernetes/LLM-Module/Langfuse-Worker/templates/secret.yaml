{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-worker-secrets
  labels:
    app: "{{ .Values.release_name }}"
    component: langfuse-worker
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
