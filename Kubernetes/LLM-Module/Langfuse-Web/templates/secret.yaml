{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-web-secrets
  labels:
    app: "{{ .Values.release_name }}"
    component: langfuse-web
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- range $key, $value := .Values.initSecrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
