apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gui-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - host: {{ .Values.gui.ingress.host }}
    http:
      paths:
      - path: /rag-search
        pathType: Prefix
        backend:
          service:
            name: gui
            port:
              number: 3001
      - path: /vault-agent-gui
        pathType: Prefix
        backend:
          service:
            name: gui
            port:
              number: 3001
