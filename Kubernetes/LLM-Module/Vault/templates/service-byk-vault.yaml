{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.release_name }}"
  labels:
    app: "{{ .Values.release_name }}"
    component: vault
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "ClusterIP" }}
  {{- if .Values.service.headless }}
  clusterIP: None
  {{- end }}
  {{- end }}
  selector:
    app: "{{ .Values.release_name }}"
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
{{- end }}