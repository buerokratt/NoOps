{{- if .Values.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Values.release_name }}"
  labels:
    app: "{{ .Values.release_name }}"
    component: vault
spec:
  serviceName: "{{ .Values.release_name }}"
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: "{{ .Values.release_name }}"
  template:
    metadata:
      labels:
        app: "{{ .Values.release_name }}"
        component: vault
    spec:
      {{- if .Values.securityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
      {{- end }}
      {{- if .Values.initContainer.enabled }}
      initContainers:
        - name: vault-init
          image: "{{ .Values.initContainer.image.registry }}/{{ .Values.initContainer.image.repository }}:{{ .Values.initContainer.image.tag }}"
          command:
            - sh
            - -c
            - |
              chown -R 100:1000 /vault/file
              chmod -R 755 /vault/file
          volumeMounts:
            - name: vault-storage
              mountPath: {{ .Values.persistence.mountPath }}
          securityContext:
            runAsUser: 0
      {{- end }}
      containers:
        - name: "{{ .Values.release_name }}"
          image: "{{ .Values.images.vault.registry }}/{{ .Values.images.vault.repository }}:{{ .Values.images.vault.tag }}"
          imagePullPolicy: {{ .Values.pullPolicy }}
          command:
            - vault
            - server
            - -config=/vault/config/vault.hcl
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            - name: cluster
              containerPort: 8201
              protocol: TCP
          env:
            - name: VAULT_ADDR
              value: "http://0.0.0.0:{{ .Values.service.targetPort }}"
            - name: VAULT_SKIP_VERIFY_CONFIG_PERMISSIONS
              value: "true"
          {{- if .Values.healthcheck.enabled }}
          livenessProbe:
            httpGet:
              path: "{{ .Values.healthcheck.httpPath }}"
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthcheck.periodSeconds }}
            timeoutSeconds: {{ .Values.healthcheck.timeoutSeconds }}
            failureThreshold: {{ .Values.healthcheck.failureThreshold }}
          readinessProbe:
            httpGet:
              path: "{{ .Values.healthcheck.httpPath }}"
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthcheck.periodSeconds }}
            timeoutSeconds: {{ .Values.healthcheck.timeoutSeconds }}
            failureThreshold: {{ .Values.healthcheck.failureThreshold }}
          {{- end }}
          volumeMounts:
            - name: vault-config
              mountPath: /vault/config
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: vault-storage
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
          resources:
            requests:
              memory: "{{ .Values.resources.requests.memory }}"
              cpu: "{{ .Values.resources.requests.cpu }}"
            limits:
              memory: "{{ .Values.resources.limits.memory }}"
              cpu: "{{ .Values.resources.limits.cpu }}"
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
      volumes:
        - name: vault-config
          configMap:
            name: "{{ .Values.release_name }}-config"
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: vault-storage
        labels:
          app: "{{ .Values.release_name }}"
          component: vault
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
  {{- end }}
{{- end }}