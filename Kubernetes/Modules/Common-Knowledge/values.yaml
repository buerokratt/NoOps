":{"et":"Erakorralised teated","en":"Emergency notices"},"path":"/chatbot/emergency-notices"},{"label":{"et":"Tagasiside","en":"Feedback"},"path":"/chatbot/feedback"}]},{"label":{"et":"Vestluste analüüs","en":"Chat analysis"},"path":"/chat-analysis"},{"label":{"et":"Asutuse tööaeg","en":"Office opening hours"},"path":"/working-time"},{"label":{"et":"Sessiooni pikkus","en":"Session length"},"path":"/session-length"},{"label":{"et":"SKMi konfiguratsioon","en":"SKM Configuration"},"path":"/skm-configuration"},{"label":{"et":"Vestluse Kustutamine","en":"Delete Conversations"},"path":"/delete-conversations"},{"label":{"et":"Anonümiseerija","en":"Anonymizer"},"path":"/anonymizer"},{"hidden": false,"label":{"et":"Multidomeenid","en":"Multi-Domains"},"path":"/multi-domains"}]},{"id":"monitoring","hidden":true,"label":{"et":"Seire","en":"Monitoring"},"path":"/monitoring","children":[{"label":{"et":"Aktiivaeg","en":"Working hours"},"path":"/uptime"}]}]'
    - name: REACT_APP_NOTIFICATION_NODE_URL
      value: "https://RUUTER.DOMAIN"
    - name: REACT_APP_CONVERSATIONS_BASE_URL
      value: https://ADMIN.DOMAIN/chat
    - name: REACT_APP_TRAINING_BASE_URL
      value: https://ADMIN.DOMAIN/training
    - name: REACT_APP_ANALYTICS_BASE_URL
      value: https://ADMIN.DOMAIN/analytics
    - name: REACT_APP_SERVICES_BASE_URL
      value: https://ADMIN.DOMAIN/services
    - name: REACT_APP_SETTINGS_BASE_URL
      value: https://ADMIN.DOMAIN/chat

  volumes:
    enabled: false
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"
  ingress:
    enabled: true
    host: ADMIN.DOMAIN
    annotations:
      kubernetes.io/ingress.class: "nginx"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    tlsSecret: admin-tls

# --- Cron Manager --------------------------------------------------------------
cronManager:
  enabled: false
  nameOverride: cron-manager
  image:
    repository: ghcr.io/buerokratt/cronmanager
    tag: v1.1.1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9010
  env:
    - name: SERVER_PORT
      value: "9010"
  volumes:
    enabled: true

# --- OpenSearch ----------------------------------------------------------------
opensearch:
  enabled: false
  nameOverride: opensearch-node
  image:
    repository: opensearchproject/opensearch
    tag: "2.11.1"
    pullPolicy: IfNotPresent
  service:
    annotations: {}
    node:
      type: ClusterIP
      ports:
        rest: 9200
        metrics: 9600
  env:
    - name: node.name
      value: "opensearch-node"
    - name: discovery.type
      value: "single-node"
    - name: bootstrap.memory_lock
      value: "true"
    - name: OPENSEARCH_JAVA_OPTS
      value: "-Xms1g -Xmx1g"
    - name: plugins.security.disabled
      value: "true"
    - name: node.max_local_storage_nodes
      value: '2'
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
    existingClaim: ""
  resources: {}

# --- Search Service ------------------------------------------------------------
searchService:
  enabled: true
  nameOverride: search-service
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: search-dev-1.3.5
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    externalPort: 3009
  env:
    - name: OPENSEARCH_URL
      value: "http://component-opensearch-node:9200"
    - name: DATA_PATH
      value: "/app/data"
    - name: PORT
      value: "3000"
  volumes:
    enabled: false
  extraVolumes: []
  extraVolumeMounts: []
  restartPolicy: Always

# --- TIM ----------------------------------------------------------------------
tim:
  enabled: false
  nameOverride: tim
  ingress:
    enabled: true
    host: TIM.DOMAIN
    secretName: tim-tls
  image:
    repository: ghcr.io/buerokratt/tim
    tag: pre-apha-2.7.1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8085
  env:
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: tim-postgres-secret
          key: POSTGRES_PASSWORD
  config:
    security_allowlist_jwt: "ruuter,ruuter-internal,data-mapper,resql,tim,tim-postgresql,chat-widget,authentication-layer,127.0.0.1,::1"
    jwt_keystore_password: "defaultpassword"
    jwt_issuer: "DOMAIN"
    spring_profiles_active: "dev"
    logging_level_root: "DEBUG"
    legacy_cookie_name: "PHPSESSID"
    legacy_cookie_domain: "DOMAIN" 
    legacy_referer_marker: "NA"
    legacy_url: "NA"
    oauth2_client_id: "" #client_id
    oauth2_client_secret: "" #client_secret
    oauth2_client_scope: "openid"
    oauth2_user_auth_uri: "X/oidc/authorize"
    oauth2_access_token_uri: "X/oidc/token"
    oauth2_jwk_uri: "X/oidc/jwks"
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "250m"
        memory: "256Mi"

# --- TIM PostgreSQL ------------------------------------------------------------
timPostgresql:
  enabled: false
  nameOverride: tim-postgresql
  image:
    repository: postgres
    tag: "14.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
    externalPort: 9876
  env:
    - name: POSTGRES_USER
      value: "tim"
    - name: POSTGRES_DB
      value: "tim"
    - name: POSTGRES_HOST_AUTH_METHOD
      value: "trust"
  secret:
    create: true
    name: tim-postgres-secret
    keys:
      POSTGRES_PASSWORD: "Ab123"
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
    existingClaim: ""

# --- Scrapper (server & celery) -----------------------------------------------
scrapperServer:
  enabled: true
  nameOverride: scrapper-server
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: server-dev-1.3.9
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  env:
    - name: RUUTER_INTERNAL
      value: "http://ruuter-internal:8089"
    - name: BROKER_URL
      value: "pyamqp://admin:admin@rabbit-scrapper/scrapper"
  volumes:
    enabled: false
  extraVolumes: []
  extraVolumeMounts: []
  dependsOn:
    rabbitmq: true

scrapperCelery:
  enabled: true
  nameOverride: scrapper-celery
  image: 
    repository: ghcr.io/buerokratt/common-knowledge
    tag: v1.0.1-scrapper-celery
    pullPolicy: IfNotPresent
  env:
    - name: RUUTER_INTERNAL
      value: "http://ruuter-internal:8089"
    - name: BROKER_URL
      value: "pyamqp://admin:admin@rabbit-scrapper/scrapper"
  volumes:
    enabled: false
  extraVolumes: []
  extraVolumeMounts: []

# --- Cleaning Server -----------------------------------------------------------
cleaningServer:
  enabled: true
  nameOverride: cleaning-server
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: cleaner-dev-1.3.10
    pullPolicy: IfNotPresent
  # The cleaner image starts uvicorn through its own CMD.
  command: []
  service:
    type: ClusterIP
    port: 8123
  env:
    - name: RUUTER_INTERNAL
      value: "http://ruuter-internal:8089"
    - name: BROKER_URL
      value: "pyamqp://admin:admin@rabbit-scrapper/scrapper"
  volumes:
    enabled: true
  extraVolumes: []
  extraVolumeMounts: []
  vault:
    enabled: true
    address: http://vault-central-buerokratt-vault.central.svc.cluster.local:8200
    secretPath: ckb/llm/connections/azure_openai/cleaner
    approleSecretName: ckb-cleaner-approle
    agentImage:
      repository: hashicorp/vault
      tag: "1.21.3"
      pullPolicy: IfNotPresent

# --- RabbitMQ (scrapper) -------------------------------------------------------
rabbitmq:
  enabled: true
  nameOverride: rabbit-scrapper
  image:
    repository: rabbitmq
    tag: 4-management
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    amqpPort: 5672
    uiPort: 15672
  env:
    - name: RABBITMQ_DEFAULT_USER
      value: "admin"
    - name: RABBITMQ_DEFAULT_PASS
      value: "admin"
    - name: RABBITMQ_DEFAULT_VHOST
      value: "scrapper"

# --- Scheduler -----------------------------------------------------------------
scheduler:
  enabled: true
  nameOverride: scheduler
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: scheduler-dev-1-1-1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8124

resqlUsers:
  enabled: false
