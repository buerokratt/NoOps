# Global settings applied across templates
global:
  imageRegistry: ""
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent
  labels: {}
  annotations: {}
  domain: DOMAIN # 
  tim_postgresql:
    auth:
      username: tim
serviceAccount:
  create: true
  name: ""
  annotations: {}

# --- Database (PostgreSQL) -----------------------------------------------------
database:
  enabled: false
  nameOverride: database
  image:
    repository: postgres
    tag: "14.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
    annotations: {}
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
    existingClaim: ""
  env:
    - name: POSTGRES_USER
      value: "byk"
    - name: POSTGRES_DB
      value: "ckb_db"
    - name: PGDATA
      value: /var/lib/postgresql/data/pgdata
  secret:
    create: true
    name: database-secret
    keys:
      POSTGRES_PASSWORD: "01234"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- Liquibase --------------------------------------------------------
liquibase:
  enabled: false
  backoffLimit: 3
  image:
    repository: liquibase/liquibase
    tag: "latest"
    pullPolicy: IfNotPresent
  repo: "https://github.com/buerokratt/Buerokratt-Chatbot.git"
  branch: "v3.3.1"
  path: "DSL/Liquibase"
  env:
    - name: POSTGRES_USER
      value: "byk"
    - name: LIQUIBASE_URL
      value: "jdbc:postgresql://ckb-database:5432/ckb_db"

# --- File Processing API --------------------------------------------------------
fileProcessing:
  enabled: true
  nameOverride: file-processing-api
  # Release the existing RWO mounts before starting the replacement Pod.
  strategy:
    type: Recreate
    rollingUpdate: null
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: fileproc-dev-1.3.5
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8888
  ingress:
    enabled: true
    className: ""
    hosts: []
    tls: []
  env:
    - name: AWS_ACCESS_KEY_ID
      value: "admin"
    - name: AWS_SECRET_ACCESS_KEY
      value: "" # Password
    - name: AWS_REGION
      value: "us-east-1"
    - name: S3_BUCKET_NAME
      value: "ckb"
    - name: S3_ENDPOINT_URL
      value: "https://s3" #s3 url
    - name: SOURCE_PATH
      value: ""
    - name: S3_PRESIGNED_URL_EXPIRATION
      value: "3600"
    - name: S3_UPLOAD_URL_EXPIRATION
      value: "3600"
    - name: AUTO_CLEANUP_COMPLETED_TASKS
      value: "true"
    - name: COMPLETED_TASK_CLEANUP_DELAY_MINUTES
      value: "5"
    - name: PERIODIC_CLEANUP_INTERVAL_MINUTES
      value: "60"
    - name: MAX_TASK_AGE_HOURS
      value: "24"
  probes:
    path: /docs
    initialDelaySeconds: 40
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  persistence:
    enabled: true
    size: 1Gi
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

# --- ReSQL (ckb) ---------------------------------------------------------------
resqlCkb:
  enabled: false
  nameOverride: resql-ckb
  image:
    repository: ghcr.io/buerokratt/resql
    tag: v1.3.4
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8090
  env:
    - name: server.port
      value: "8090"
    - name: SQLMS_DATASOURCES_0_NAME
      value: "byk"
    - name: SQLMS_DATASOURCES_0_JDBCURL
      value: "jdbc:postgresql://database:5432/ckb_db"
    - name: SQLMS_DATASOURCES_0_USERNAME
      value: "byk"
    - name: SQLMS_DATASOURCES_0_PASSWORD
      value: "01234"
    - name: LOGGING_LEVEL_ROOT
      value: "INFO"
  volumes:
    enabled: true
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"
  extraVolumes: []
  extraVolumeMounts: []

# --- Ruuter (public) -----------------------------------------------------------
ruuter:
  enabled: false
  ingress:
    enabled: true
    host: RUUTER.DOMAIN
    annotations:
      kubernetes.io/ingress.class: "nginx"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    tlsSecret: ruuter-tls
  nameOverride: ruuter
  image:
    repository: ghcr.io/buerokratt/ruuter
    tag: v2.2.8
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8086
  env:
    - name: application.cors.allowedOrigins
      value: "https://RUUTER.DOMAIN,http://ruuter:8089,https://TIM.DOMAIN,https://ADMIN.DOMAIN"
    - name: application.httpCodesAllowList
      value: "200,201,202,400,401,403,500"
    - name: application.internalRequests.allowedIPs
      value: "127.0.0.1"
    - name: application.logging.displayRequestContent
      value: "true"
    - name: application.logging.displayResponseContent
      value: "true"
    - name: application.logging.printStackTrace
      value: "true"
    - name: application.internalRequests.disabled
      value: "true"
    - name: server.port
      value: "8086"
    - name: logging.level.root
      value: "INFO"
  config:
    constantsIni: |-
      configmap somehow
  volumes:
    mountConstantsIni: true
    mountDSL: false
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

# --- Ruuter (internal) ---------------------------------------------------------
ruuterInternal:
  enabled: true
  ingress:
    enabled: false
    host: ruuter.ckb-test.buerokratt.ee
    annotations:
      kubernetes.io/ingress.class: "nginx"
      cert-manager.io/cluster-issuer: "letsencrypt"
    tlsSecret: ruuter-tls
  nameOverride: ruuter-internal
  image:
    repository: ghcr.io/buerokratt/ruuter
    tag: v2.2.8
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8089
  env:
    - name: application.cors.allowedOrigins
      value: "http://localhost:8086,http://localhost:8089,http://localhost:3001,http://localhost:3003,http://localhost:3004,http://localhost:8080"
    - name: application.httpCodesAllowList
      value: "200,201,202,400,401,403,500"
    - name: application.internalRequests.allowedIPs
      value: "127.0.0.1"
    - name: application.logging.displayRequestContent
      value: "true"
    - name: application.logging.displayResponseContent
      value: "true"
    - name: application.logging.printStackTrace
      value: "true"
    - name: application.internalRequests.disabled
      value: "true"
    - name: server.port
      value: "8089"
  config:
    constantsIni: |-
      configmap somehow
  volumes:
    mountConstantsIni: true
    mountDSL: false
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

# --- Data Mapper ---------------------------------------------------------------
dataMapper:
  enabled: false
  nameOverride: ckb-data-mapper
  image: 
    repository: ghcr.io/buerokratt/datamapper
    tag: v2.2.9
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3005
  env:
    - name: PORT
      value: "3005"
    - name: CONTENT_FOLDER
      value: "/data"
  volumes:
    enabled: true
  extraVolumes:
    - name: dsl
      emptyDir: {}
  extraVolumeMounts:
    - name: dsl
      mountPath: /DSL

# --- Data Export ---------------------------------------------------------------
dataExport:
  enabled: true
  nameOverride: data-export
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: data-export-dev-1-1-1
    pullPolicy: IfNotPresent
  command: ["python", "debug.py"]
  service:
    type: ClusterIP
    port: 8889
    targetPort: 8888
  env:
    - name: DB_URI
      value: "postgresql://byk:01234@database:5432/byk"
  volumes:
    enabled: false
  extraVolumes: []
  extraVolumeMounts: []

# --- Authentication Layer ------------------------------------------------------
authenticationLayer:
  enabled: false
  nameOverride: authentication-layer
  image:
    repository: ghcr.io/buerokratt/authentication-layer
    tag: v1.1.1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3004
  ingress:
    enabled: false
    host: ADMIN.DOMAIN
    annotations:
      kubernetes.io/ingress.class: "nginx"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    tlsSecret: admin-tls

# --- GUI (React) ---------------------------------------------------------------
gui:
  enabled: true
  nameOverride: ckb-gui
  image:
    repository: ghcr.io/buerokratt/common-knowledge
    tag: v1.0.1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3001
