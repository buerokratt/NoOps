            - name: REACT_APP_RUUTER_PRIVATE_ENDED_API_URL
              value: "{{ .Values.env.REACT_APP_RUUTER_PRIVATE_ENDED_API_URL }}"
            - name: REACT_APP_SHOW_AUTO_CLOSE_CONFIG
              value: "TRUE"
            - name: REACT_APP_ENABLE_MULTI_DOMAIN
              value: "{{ MULTI.DOMAIN }}"
            - name: REACT_APP_SMAX_INTEGRATION_ENABLED
              value: "FALSE"
            - name: REACT_APP_JIRA_INTEGRATION_ENABLED
              value: "FALSE"
            - name: REACT_APP_REFLECT_DOMAINS
              value: "FALSE"
            - name: REACT_APP_CURRENT_VERSION
