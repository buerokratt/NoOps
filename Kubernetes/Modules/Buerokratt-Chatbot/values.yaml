nameOverride: module-byk-backoffice-gui
fullnameOverride: module-byk-backoffice-gui
replicaCount: 1
 
workload:
  kind: Deployment
  selectorLabels: {app: module-byk-backoffice-gui}
 
image:
  repository: ghcr.io
  name: buerokratt/buerokratt-chatbot
  tag: "v3.3.2"
  pullPolicy: IfNotPresent
 
containerPorts:
  - {name: http, containerPort: 3001}
 
env: []
 
resources:
  requests: {cpu: 1m, memory: 10Mi}
  limits: {cpu: 5m, memory: 50Mi}
 
services:
  http:
    name: module-byk-backoffice-gui
    ports:
      http: {port: 3001, targetPort: http, protocol: TCP}
 
ingress: {enabled: false}
istio: {enabled: false}
 
constantsIni: |
  REACT_APP_ENABLE_HIDDEN_FEATURES=TRUE