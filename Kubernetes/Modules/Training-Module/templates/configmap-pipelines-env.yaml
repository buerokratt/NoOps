apiVersion: v1
kind: ConfigMap
metadata:
  name: pipelines-env
data:
  OPENSEARCH_HOST: {{ .Values.opensearch.host | quote }}
  OPENSEARCH_PORT: {{ .Values.opensearch.port | quote }}
  OPENSEARCH_PROTOCOL: {{ .Values.opensearch.protocol | quote }}
{{- if not .Values.opensearch.credentialsSecret }}
  OPENSEARCH_AUTH: {{ .Values.opensearch.auth | quote }}
{{- end }}
  TRAINING_RESPONSES_INDEX: {{ index (.Values.global.opensearch.resources) "TRAINING_RESPONSES_INDEX" | quote }}
  TRAINING_INTENTS_INDEX: {{ index (.Values.global.opensearch.resources) "TRAINING_INTENTS_INDEX" | quote }}
  TRAINING_RULES_INDEX: {{ index (.Values.global.opensearch.resources) "TRAINING_RULES_INDEX" | quote }}
  TRAINING_STORIES_INDEX: {{ index (.Values.global.opensearch.resources) "TRAINING_STORIES_INDEX" | quote }}
  TRAINING_TEST_STORIES_INDEX: {{ index (.Values.global.opensearch.resources) "TRAINING_TEST_STORIES_INDEX" | quote }}
  TRAINING_FORMS_INDEX: {{ index (.Values.global.opensearch.resources) "TRAINING_FORMS_INDEX" | quote }}
  TRAINING_ENTITIES_INDEX: {{ index (.Values.global.opensearch.resources) "TRAINING_ENTITIES_INDEX" | quote }}
  TRAINING_REGEXES_INDEX: {{ index (.Values.global.opensearch.resources) "TRAINING_REGEXES_INDEX" | quote }}
  TRAINING_EXAMPLES_ENTITIES_INDEX: {{ index (.Values.global.opensearch.resources) "TRAINING_EXAMPLES_ENTITIES_INDEX" | quote }}
  TRAINING_SLOTS_INDEX: {{ index (.Values.global.opensearch.resources) "TRAINING_SLOTS_INDEX" | quote }}
  TRAINING_CONFIG_INDEX: {{ index (.Values.global.opensearch.resources) "TRAINING_CONFIG_INDEX" | quote }}
  TRAINING_NOTIFICATIONS_INDEX: {{ index (.Values.global.opensearch.resources) "TRAINING_NOTIFICATIONS_INDEX" | quote }}
  SERVICE_SERVICES_INDEX: {{ index (.Values.global.opensearch.resources) "SERVICE_SERVICES_INDEX" | quote }}
  SERVICE_FAULTS_INDEX: {{ index (.Values.global.opensearch.resources) "SERVICE_FAULTS_INDEX" | quote }}
  SERVICE_RUUTERLOG_INDEX: {{ index (.Values.global.opensearch.resources) "SERVICE_RUUTERLOG_INDEX" | quote }}
  SHARED_DOMAIN_INDEX: {{ index (.Values.global.opensearch.resources) "SHARED_DOMAIN_INDEX" | quote }}
  COMMON_COMPANIES_INDEX: {{ index (.Values.global.opensearch.resources) "COMMON_COMPANIES_INDEX" | quote }}
  OPENSEARCH_SCRIPT_PREFIX: {{ index (.Values.global.opensearch.resources) "OPENSEARCH_SCRIPT_PREFIX" | quote }}
  COMMON_COMPANIES_PIPELINE: {{ index (.Values.global.opensearch.resources) "COMMON_COMPANIES_PIPELINE" | quote }}
