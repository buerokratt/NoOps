imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

domain: {{ domain.name }} # Domain name

#ingress:
#  tlsConfigMapName: byk-tls-configmap

ingress:
  certIssuerName: letsencrypt-prod # Change this if your certIssuerName has set up different

#release_name: "postdeploy"
release_name: "job-postdeploy"
releaseName: post-deploy-pipeline

dslRepo: "https://gitlab.ria.ee/BYK/Training-Module.git"
dslPath: "/"
dslBranch: "varmoh-patch-2"


images:
  scope:
    image: opensearchproject/opensearch:latest
  pipelines:
    training:
      repo: https://gitlab.ria.ee/BYK/Training-Module.git
      path: /
  dsl:
    registry: "registry.gitlab.ria.ee"
    repository: "byk/buerokratt-dsl"
    tag: "{{ module.training.image.version }}" # Images (tags) are up to date, currently no changes needed

liquibase:
  jdbcUrl: "jdbc:postgresql://databases-users-db:5432/byk?user=byk"    
  dbPassword: "{{ usersDB.password }}"   # Change password accordingly