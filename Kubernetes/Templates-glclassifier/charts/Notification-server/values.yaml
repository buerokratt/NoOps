release_name: "component-byk-notifications-node"

image:
  registry: "ghcr.io"
  repository: "buerokratt/notifications-node"
  tag: "latest"

replicas: 1

resources:
  requests:
    memory: "500Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

env:
  OPENSEARCH_PROTOCOL: "http"
  OPENSEARCH_HOST: "opensearch-node"
  OPENSEARCH_PORT: "9200"
  OPENSEARCH_USERNAME: "admin"
  OPENSEARCH_PASSWORD: "admin"
  PORT: "4040"
  REFRESH_INTERVAL: "1000"
  CORS_WHITELIST_ORIGINS: "http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:8080,http://localhost:8088"
  RUUTER_URL: "http://ruuter-public:8086"

volumes:
  app_node_modules:
    type: emptyDir
  notifications_app:
    type: emptyDir

ingress:
  enabled: true
  path: "/"
  cors_allowed_origins: "*" 
  cors_allow_methods: "GET, POST, PUT, DELETE, OPTIONS"
  cors_allow_headers: "Origin, X-Requested-With, Content-Type, Cache-Control, Connection, Accept"
  cluster_issuer: "letsencrypt-prod-issuer"
  tls:
    enabled: true
secretname: "notifications-node-tls"

# Istio lülitus (vajadusel)
istio:
  enabled: false

istio:
  enabled: false
