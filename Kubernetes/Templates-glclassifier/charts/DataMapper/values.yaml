release_name: "component-byk-dmapper"
domain: "example.com"
istio:
  enabled: false
images:
  scope:
    registry: "ghcr.io"
    repository: "buerokratt/datamapper"
    tag: "v1.0.0"
  backoffice:
    registry: "ghcr.io"
    repository: "buerokratt/buerokratt-dsl"
    tag: "v1.0.0"
  analytics:
    registry: "ghcr.io"
    repository: "buerokratt/buerokratt-dsl"
    tag: "v1.0.0"
  services:
    registry: "ghcr.io"
    repository: "buerokratt/buerokratt-dsl"
    tag: "v1.0.0"
  training:
    registry: "ghcr.io"
    repository: "buerokratt/buerokratt-dsl"
    tag: "v1.0.0"

dslRepos:
  pipelines:
    repo: "https://github.com/buerokratt/Service-Module.git"
    path: "/DSL"
  bot:
    repo: "https://github.com/buerokratt/Training-Module.git"
    path: "DSL/DMapper/locations"
  commonservice:
    repo: "https://github.com/buerokratt/Common-Services.git"
    path: "/"
  sec:
    repo: "https://github.com/buerokratt/Service-Module.git"
    path: "/secrets"

resources:
  requests:
    memory: "1000Mi"
    cpu: "100m"
  limits:
    memory: "2000Mi"
    cpu: "100m"

replicas: 1

global:
  opensearch:
    resources:
      TRAINING_RESPONSES_INDEX: "responses"
      TRAINING_INTENTS_INDEX: "intents"
      TRAINING_RULES_INDEX: "rules"
      TRAINING_STORIES_INDEX: "stories"
      TRAINING_TEST_STORIES_INDEX: "test-stories"
      TRAINING_FORMS_INDEX: "forms"
      TRAINING_ENTITIES_INDEX: "entities"
      TRAINING_REGEXES_INDEX: "regexes"
      TRAINING_EXAMPLES_ENTITIES_INDEX: "examples-entities"
      TRAINING_SLOTS_INDEX: "slots"
      TRAINING_CONFIG_INDEX: "config"
      TRAINING_NOTIFICATIONS_INDEX: "notifications"
      SERVICE_SERVICES_INDEX: "services"
      SERVICE_FAULTS_INDEX: "faults"
      SERVICE_RUUTERLOG_INDEX: "ruuterlog"
      SHARED_DOMAIN_INDEX: "domain"
      COMMON_COMPANIES_INDEX: "companies"
      OPENSEARCH_SCRIPT_PREFIX: ""
      COMMON_COMPANIES_INGEST_ENABLED: "false"
      COMMON_COMPANIES_PIPELINE: "companies-pipeline"
      COMMON_MUNICIPALITIES_INDEX: "municipalities"

opensearch:
  url: "http://component-opensearch-node:9200"
  credentialsSecret: "" # auth key; empty keeps existing script fallback.
