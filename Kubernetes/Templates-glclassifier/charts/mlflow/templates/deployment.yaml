apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Values.release_name }}"
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: "{{ .Values.release_name }}"
  template:
    metadata:
      labels:
        app: "{{ .Values.release_name }}"
    spec:
      containers:
        - name: "{{ .Values.release_name }}"
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 5000
              name: http
          env:
{{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
{{- end }}
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow/mlflow_data
            - name: mlflow-artifacts
              mountPath: /mlflow/mlflow_artifacts
      volumes:
        - name: mlflow-data
          persistentVolumeClaim:
            claimName: pvc-{{ .Release.Namespace }}-mlflow-data
        - name: mlflow-artifacts
          persistentVolumeClaim:
            claimName: pvc-{{ .Release.Namespace }}-mlflow-artifacts
