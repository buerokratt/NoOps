image:
  repository: ghcr.io/buerokratt/presidio-anonymizer
  tag: dev-1.1.2
  pullPolicy: IfNotPresent

service:
  port: 8089
  type: ClusterIP

env:
  FLASK_ENV: production
  LOG_LEVEL: info
  HOST: "0.0.0.0"
  PORT: "8089"
  PYTHONUNBUFFERED: "1"

resources:
  requests:
    memory: "1Gi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "100m"
