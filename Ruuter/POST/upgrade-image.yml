extractRequestData:
  assign:
    image: ${incoming.body}
  next: update_image

update_image:
  call: http.post
  args:
    url: "[#DEPLOY_CRON]/execute/update-image/update_image"
    body:
      image: ${image}
  result: update_image_status

logstep:
  log: ${update_image_status}
logstep2:
  log: ${update_image_status.response.body.response}

checkIfImageUpdated:
  switch:
    - condition: "${update_image_status.response.body.response != 200}"
      next: returnFailed
  next: deploy_image

deploy_image:
  call: http.post
  args:
    url: "[#DEPLOY_CRON]/execute/deploy-image/deploy_image"
  result: deploy_image_status


checkIfImageDepolyed:
  switch:
    - condition: "${deploy_image_status != 200}"
      next: returnFailed
  next: returnSuccess

returnSuccess:
  return: "Successfully executed command"
  next: end

returnFailed:
  return: "Failed executing command"
  next: end
